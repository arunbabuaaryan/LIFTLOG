function selectDay(i, afterSwitch, swipeDirection) {
  if (i === currentDayIdx) { if (afterSwitch) afterSwitch(); return; }
  const doSwitch = () => { currentDayIdx = i; liveSets = {}; focusOverrideId = null; redoUnlocked = new Set(); render(); requestAnimationFrame(scrollActiveTabsIntoView); if (swipeDirection) playSwipeTransition(swipeDirection); if (afterSwitch) afterSwitch(); };
  if (hasUnsavedFocusProgress(currentDayIdx)) {
    showConfirm({
      title: 'Switch workout group?',
      message: `You've checked off or adjusted sets on ${DAYS[currentDayIdx].label} that haven't been finished yet. Switching now discards that — it won't be saved.`,
      confirmLabel: 'Switch anyway',
      danger: true,
      onConfirm: doSwitch
    });
  } else {
    doSwitch();
  }
}

// ---------- SWIPE NAVIGATION (switch day/group by swiping left/right) ----------
let swipeStartX = null, swipeStartY = null, swipeStartTime = 0;
const SWIPE_MIN_DX = 45;       // minimum horizontal travel to count as a deliberate swipe
const SWIPE_MAX_DY = 70;       // more vertical travel than this means it's a scroll, not a swipe
const SWIPE_TIME_LIMIT = 700;  // ms — ignore slow drags

function handleSwipeStart(e) {
  if (e.touches.length !== 1) { swipeStartX = null; return; }
  // Don't hijack swipes that start on the horizontally-scrollable tab strip itself,
  // or inside any text input/textarea/select — e.g. the "Add Exercise" form in
  // Settings, where swiping to change days would otherwise re-render the screen
  // and silently discard whatever was being typed.
  if (e.target.closest('.tabs') || e.target.closest('input, textarea, select')) { swipeStartX = null; return; }
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swipeStartTime = Date.now();
}

function handleSwipeEnd(e) {
  if (swipeStartX === null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStartX;
  const dy = t.clientY - swipeStartY;
  const dt = Date.now() - swipeStartTime;
  swipeStartX = null;
  if (dt > SWIPE_TIME_LIMIT) return;
  if (Math.abs(dx) < SWIPE_MIN_DX) return;
  if (Math.abs(dy) > SWIPE_MAX_DY) return;
  if (Math.abs(dx) < Math.abs(dy)) return; // predominantly vertical -> treat as scroll

  const direction = dx < 0 ? 1 : -1; // swipe left = next day, swipe right = previous day
  if (view === 'workout' || view === 'manage') {
    const next = (currentDayIdx + direction + DAYS.length) % DAYS.length; // wrap around at both ends
    selectDay(next, null, direction);
  } else if (view === 'progress') {
    const next = (progressDayIdx + direction + DAYS.length) % DAYS.length; // wrap around at both ends
    selectProgressDay(next, direction);
  }
}

// Attach once to the stable #app container (its innerHTML is replaced on render,
// but the element itself persists, so the listeners keep working).
document.getElementById('app').addEventListener('touchstart', handleSwipeStart, { passive: true });
document.getElementById('app').addEventListener('touchend', handleSwipeEnd, { passive: true });
document.getElementById('app').addEventListener('touchcancel', () => { swipeStartX = null; }, { passive: true });

// ---------- LOGGING ----------
function getLastValueForSet(ex, setIdx) {
  for (let i = state.history.length - 1; i >= 0; i--) {
    const h = state.history[i];
    if (h.exercise === ex.name && h.sets[setIdx] != null) return h.sets[setIdx];
  }
  return null;
}

function getTargetValue(ex) {
  return getExerciseMode(ex).getTargetValue(getExState(ex));
}

function ensureLive(ex) {
  const target = getTargetValue(ex);
  const s = getExState(ex);
  const setCount = getExerciseMode(ex).usesProgressiveSets ? s.sets : ex.sets;
  if (!liveSets[ex.id] || liveSets[ex.id].length !== setCount) {
    liveSets[ex.id] = Array.from({length: setCount}, () => ({ value: target, doneMark: false }));
  }
  return liveSets[ex.id];
}

function isDoneToday(exName, dayLabel) {
  const { anchorDate, sessionNum } = getActiveSession(dayLabel);
  return state.history.some(h => getEntryDateKey(h) === anchorDate && h.day === dayLabel && h.exercise === exName && getEntrySessionNum(h) === sessionNum);
}

// Native scrollIntoView({block:'center'}) centers against the full viewport,
// with no idea that the sticky header, fixed bottom nav, and (when a timer's
// running) the timer FAB all visually cover part of that viewport — so it
// can happily "center" a card with its top half behind the header or its
// bottom half behind the nav/FAB. This computes the actual visible area
// between those fixed elements and positions within THAT instead. Default
// behavior top-aligns the element (so the whole tile is visible starting
// right below the header) rather than centering it. Falls back to native
// scrollIntoView if anything's missing (shouldn't happen, but this should
// never be the thing that breaks scrolling entirely).
//
// opts.keepInUpperFraction + opts.focusSelector: for landing on the NEXT
// exercise after finishing one — top-aligning the card is usually enough to
// keep its sets-logging rows within comfortable one-handed thumb reach, but
// a card with a lot of sets can be tall enough to push them further down
// than that. If given, this checks where the focusSelector sub-element
// (the sets rows) would actually land and, if its bottom would fall below
// keepInUpperFraction of the safe area, re-anchors so that section's bottom
// sits right at that line instead — prioritizing "all the sets are
// reachable" over "the whole card, buttons and all, is visible".
function scrollElementIntoSafeView(el, opts = {}) {
  if (!el) return;
  try {
    const header = document.querySelector('header');
    const nav = document.querySelector('.nav');
    const fab = document.getElementById('timerFab');
    const headerH = header ? header.getBoundingClientRect().height : 0;
    const navH = nav ? nav.getBoundingClientRect().height : 0;
    const fabShowing = fab && fab.style.display !== 'none' && fab.getBoundingClientRect().height > 0;
    const fabH = fabShowing ? fab.getBoundingClientRect().height + 24 : 0; // + breathing room
    const rect = el.getBoundingClientRect();
    const safeTop = headerH + 10;
    const safeBottom = window.innerHeight - navH - fabH - 10;
    const safeHeight = safeBottom - safeTop;
    if (safeHeight <= 0) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }

    let delta = rect.top - safeTop; // top-align by default

    if (opts.keepInUpperFraction != null) {
      const focusEl = opts.focusSelector ? el.querySelector(opts.focusSelector) : null;
      if (focusEl) {
        const focusRect = focusEl.getBoundingClientRect();
        const projectedFocusBottom = focusRect.bottom - delta;
        const limit = safeTop + safeHeight * opts.keepInUpperFraction;
        if (projectedFocusBottom > limit) {
          delta += (projectedFocusBottom - limit); // re-anchor so the sets rows' bottom lands at the limit
        }
      }
    }
    window.scrollBy({ top: delta, behavior: 'smooth' });
  } catch (e) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function scrollToNextIncomplete(justFinishedEx) {
  // Focus Mode deliberately shows one exercise at a time so scrolling is
  // never required to reach it — the next exercise just replaces the
  // current card in place. Running the scroll logic anyway here would work
  // against that (and risks a small unwanted shift from the up-next
  // preview / completed-count summary changing size when render swaps in
  // the new active exercise).
  if (getFocusMode()) return;
  const day = DAYS[currentDayIdx];
  // If the exercise just finished is part of a superset and its partner
  // isn't done yet, that partner is specifically where "continue the
  // superset" means — not just whichever exercise happens to come first in
  // the day's list (which could be a completely unrelated one if the
  // superset pair isn't first in the array).
  let next = null;
  if (justFinishedEx && justFinishedEx.supersetGroup) {
    next = getSupersetPartners(justFinishedEx, day).find(p => !isDoneToday(p.name, day.label));
  }
  if (!next) next = day.exercises.find(ex => !isDoneToday(ex.name, day.label));
  if (next) {
    const el = document.getElementById(`card-${next.id}`);
    // Only fires once the just-finished exercise's whole set is done (see
    // finishExerciseConfirmed) — never mid-exercise while still logging
    // individual sets, which uses renderPreservingScroll instead and
    // deliberately doesn't move the screen at all.
    scrollElementIntoSafeView(el, { keepInUpperFraction: 0.75, focusSelector: '.sets' });
  } else {
    const banner = document.querySelector('.complete-banner');
    scrollElementIntoSafeView(banner);
  }
}

function getExerciseById(exId) {
  for (const day of DAYS) {
    const ex = day.exercises.find(e => e.id === exId);
    if (ex) return ex;
  }
  return null;
}

// ---------- LINKED EXERCISES (one exercise, multiple muscle-group days) ----------
// A "linked" exercise is one that appears in more than one day's exercises[]
// array *with the same id*. Progression state (state.exercises[id]) is keyed
// purely by id, and history/PRs are keyed purely by exercise name — both
// already live outside the per-day DAYS array — so a shared id automatically
// gets shared progression across every day it's linked to, with zero changes
// needed to the progression engine itself. The only thing this layer has to
// actively maintain is keeping each day's *copy* of the exercise's config
// (name, mode, rep/set range, notes, fail threshold) in sync, since those are
// duplicated objects for rendering/ordering purposes. Rest times are
// deliberately left per-day — resting longer between sets on a heavier day is
// a legitimate difference, not drift.
const LINKED_SYNC_FIELDS = ['name', 'mode', 'repLow', 'repHigh', 'setsMin', 'setsMax', 'sets', 'startReps', 'startSeconds', 'startWeight', 'failThreshold', 'notes', 'progressReps', 'progressSets', 'progressWeight', 'repIncrement', 'beltIncrement', 'timeIncrement', 'weightIncrement', 'diagramImageId', 'diagramPosX', 'diagramPosY', 'diagramZoom'];

function getLinkedCopies(exId) {
  const copies = [];
  DAYS.forEach((day, dayIdx) => {
    const ex = day.exercises.find(e => e.id === exId);
    if (ex) copies.push({ day, dayIdx, ex });
  });
  return copies;
}

function isExerciseLinked(exId) {
  return getLinkedCopies(exId).length > 1;
}

// Human-readable "also trained on: Back, Legs" list, excluding the day passed in.
function getLinkedDayLabel(exId, excludeDayIdx) {
  const others = getLinkedCopies(exId).filter(c => c.dayIdx !== excludeDayIdx);
  if (!others.length) return null;
  return others.map(c => `${c.day.icon} ${c.day.label}`).join(', ');
}

// After editing one copy's config fields, push those same fields onto every
// other day's copy of the same exercise so they never silently drift apart
// (which would otherwise desync the shared progression state's valid ranges —
// e.g. one day thinking reps cap at 12, another still capping at 10).
function propagateLinkedExerciseConfig(sourceEx) {
  getLinkedCopies(sourceEx.id).forEach(({ ex }) => {
    if (ex === sourceEx) return;
    LINKED_SYNC_FIELDS.forEach(f => {
      if (sourceEx[f] === undefined) delete ex[f];
      else ex[f] = sourceEx[f];
    });
  });
}

function startTimerFor(exId, opts = {}) {
  const ex = getExerciseById(exId);
  if (!ex) return;
  // opts.round: the "between rounds" rest for an alternating superset
  // (after both/all group members have logged their matching-index set),
  // as opposed to ex.rest which is the normal "between sets of this one
  // exercise" rest. Falls back to ex.rest if no round-specific value is set.
  if (opts.round && ex.supersetRoundRest != null) startRestTimer(ex.supersetRoundRest);
  else startRestTimer(ex.rest);
}

// Alternate mode and its round-rest are a property of the whole superset
// pairing, not of one exercise — so unlike supersetRest (which is
// deliberately per-exercise, since it's "the rest when leaving THIS
// exercise for its partner" and can differ by direction), these two need to
// stay identical across every member of the group or the round-detection
// logic in markSetDone() wouldn't make sense (one exercise alternating,
// its partner not). Called from the exercise editor's save handler,
// alongside propagateLinkedExerciseConfig.
function propagateSupersetGroupConfig(sourceEx) {
  if (!sourceEx.supersetGroup) return;
  const day = DAYS.find(d => d.exercises.some(e => e.id === sourceEx.id));
  if (!day) return;
  getSupersetPartners(sourceEx, day).forEach(p => {
    p.supersetAlternate = sourceEx.supersetAlternate;
    p.supersetRoundRest = sourceEx.supersetRoundRest;
  });
}

// ---------- SUPERSETS ----------
// A superset is 2+ exercises on the same day sharing a supersetGroup id,
// meant to be done back-to-back with little/no rest between them, then a
// normal rest before whatever's next. By default this is just a grouping +
// a shorter rest — you tap between exercises yourself. Optionally
// (ex.supersetAlternate), it can instead auto-navigate set-by-set: log set 1
// of A, get jumped straight to set 1 of B with no rest, and only rest once
// every group member has logged that same set index (a "round"). See the
// round-detection logic in markSetDone().
const SUPERSET_COLORS = ['#ffb020', '#20c9d6', '#c77dff', '#ff6b9d', '#6bcf7f'];
// Groups are labeled by first-appearance order within the day rather than
// stored — so removing a group never leaves a gap like "Superset C" with no
// A or B.
function getSupersetGroupsForDay(day) {
  const order = [];
  day.exercises.forEach(ex => {
    if (ex.supersetGroup && !order.includes(ex.supersetGroup)) order.push(ex.supersetGroup);
  });
  return order; // index into this = label/color index
}
function getSupersetLabel(day, groupId) {
  const idx = getSupersetGroupsForDay(day).indexOf(groupId);
  return idx === -1 ? null : String.fromCharCode(65 + (idx % 26));
}
function getSupersetColor(day, groupId) {
  const idx = getSupersetGroupsForDay(day).indexOf(groupId);
  return idx === -1 ? SUPERSET_COLORS[0] : SUPERSET_COLORS[idx % SUPERSET_COLORS.length];
}
function getSupersetPartners(ex, day) {
  if (!ex.supersetGroup) return [];
  return day.exercises.filter(e => e.id !== ex.id && e.supersetGroup === ex.supersetGroup);
}
function hasUnfinishedSupersetPartner(ex, day) {
  return getSupersetPartners(ex, day).some(e => !isDoneToday(e.name, day.label));
}
function addToSuperset(exIdA, exIdB, dayIdx) {
  const day = DAYS[dayIdx];
  const exA = day.exercises.find(e => e.id === exIdA);
  const exB = day.exercises.find(e => e.id === exIdB);
  if (!exA || !exB) return;
  const groupId = exA.supersetGroup || exB.supersetGroup || ('ss_' + Date.now().toString(36));
  exA.supersetGroup = groupId;
  exB.supersetGroup = groupId;
  if (exA.supersetRest == null) exA.supersetRest = 0;
  if (exB.supersetRest == null) exB.supersetRest = 0;
  // Alternate mode (do set 1 of A, then set 1 of B, rest, set 2 of A, ...) is
  // off by default — plain "back-to-back, tap between them yourself" stays
  // the default superset behavior. supersetRoundRest is the rest applied
  // between rounds when alternate mode is on; null means "fall back to this
  // exercise's normal ex.rest".
  if (exA.supersetAlternate == null) exA.supersetAlternate = false;
  if (exB.supersetAlternate == null) exB.supersetAlternate = false;
  // Move exB to sit directly after the rest of the group, so the group
  // renders adjacently without any special-cased non-adjacent grouping
  // logic in the card renderer. exB is removed from the array FIRST, then
  // the insert point is computed from the remaining group members —
  // computing it beforehand (while exB still counted as "a member" at its
  // own stale index) corrupted the target position in most arrangements
  // where exB wasn't already immediately before exA.
  const bIdx = day.exercises.indexOf(exB);
  day.exercises.splice(bIdx, 1);
  const others = day.exercises.filter(e => e.supersetGroup === groupId);
  const lastOtherIdx = others.length ? Math.max(...others.map(e => day.exercises.indexOf(e))) : day.exercises.indexOf(exA);
  day.exercises.splice(lastOtherIdx + 1, 0, exB);
  persistDays();
  saveState();
  render();
}
// If removing an exercise from a group leaves only one member, that's no
// longer a superset — clear its group too rather than leaving a lone
// "Superset A" badge with nothing to pair with.
function cleanupSupersetAfterRemoval(day, groupId) {
  if (!groupId) return;
  const remaining = day.exercises.filter(e => e.supersetGroup === groupId);
  if (remaining.length === 1) {
    remaining[0].supersetGroup = null;
    remaining[0].supersetRest = null;
    remaining[0].supersetAlternate = null;
    remaining[0].supersetRoundRest = null;
  }
}
function removeFromSuperset(exId, dayIdx) {
  const day = DAYS[dayIdx];
  const ex = day.exercises.find(e => e.id === exId);
  if (!ex || !ex.supersetGroup) return;
  const groupId = ex.supersetGroup;
  ex.supersetGroup = null;
  ex.supersetRest = null;
  ex.supersetAlternate = null;
  ex.supersetRoundRest = null;
  cleanupSupersetAfterRemoval(day, groupId);
  persistDays();
  saveState();
  render();
}

function matchLastSet(exId) {
  const arr = liveSets[exId];
  if (!arr || arr.length === 0) return;
  // Source is the most recently completed set, not just the final array
  // slot — if the last set hasn't been done yet, it's still sitting at its
  // untouched default target, so using it as the source silently no-ops
  // (upcoming sets already default to that same value). The last *done*
  // set actually reflects what was performed.
  let lastDoneIdx = -1;
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i].doneMark) { lastDoneIdx = i; break; }
  }
  if (lastDoneIdx === -1) return; // nothing logged yet to match from
  const val = arr[lastDoneIdx].value;
  arr.forEach(x => { if (!x.doneMark) x.value = val; });
  if (navigator.vibrate) navigator.vibrate(20);
  renderPreservingScroll(`card-${exId}`);
  persistLiveSets(exId);
}

function skipExercise(exId) {
  const ex = getExerciseById(exId);
  if (!ex) return;
  const exName = ex.name;
  const arr = ensureLive(ex); // guarantees liveSets[exId] exists so completed sets (if any) are preserved below
  const hasCompletedSets = arr.some(x => x.doneMark);
  showConfirm({
    title: 'Skip exercise?',
    message: hasCompletedSets
      ? `Skip the rest of ${exName}? Sets already checked off stay as logged; the remaining set(s) will be logged as 0.`
      : `Skip ${exName} for today? All set(s) will be logged as 0 — progression left unchanged this session.`,
    confirmLabel: 'Skip',
    danger: true,
    onConfirm: () => {
      arr.forEach(x => { if (!x.doneMark) x.value = 0; });
      finishExerciseConfirmed(ex); // logs completed sets as-is + zeros for the rest, same as a manual finish with skipped sets
      requestAnimationFrame(() => requestAnimationFrame(() => scrollToNextIncomplete(ex)));
    }
  });
}

function adjustWeightLive(exId, direction) {
  const ex = getExerciseById(exId);
  if (!ex) return;
  const mode = getExerciseMode(ex);
  if (!mode.hasWeightControl) return;
  const s = getExState(ex);
  const result = mode.adjustWeight(ex, s, direction);
  if (!result.ok) { alert(result.reason); return; }
  saveState();
  if (navigator.vibrate) navigator.vibrate(15);
  renderPreservingScroll(`card-${exId}`);
}

// Tapping the weight value itself (rather than +/- stepping one increment
// at a time) lets you jump straight to an exact number — e.g. the gym only
// has this one plate combo today, or your home dumbbells don't match the
// app's increment. This writes to the same progression state adjustWeight
// does, so it's not a "just this once" override: it becomes the baseline
// future sessions progress from, same as every other progression edit in
// the app (there's no separate "today only" layer anywhere else either).
function editWeightLive(exId) {
  const ex = getExerciseById(exId);
  if (!ex) return;
  const mode = getExerciseMode(ex);
  if (!mode.hasWeightControl || !mode.setWeight) return;
  const s = getExState(ex);
  const input = prompt(`Set weight for "${ex.name}" — currently ${mode.weightLabel(ex, s)}.\nEnter any number (this becomes your new default going forward):`, s.weight ?? s.addedWeight ?? 0);
  if (input === null) return;
  const n = parseFloat(input);
  if (isNaN(n) || n < 0) { alert('Enter a valid non-negative number.'); return; }
  mode.setWeight(ex, s, n);
  saveState();
  renderPreservingScroll(`card-${exId}`);
}

function adjustSetsLive(exId, direction) {
  const ex = getExerciseById(exId);
  if (!ex) return;
  const s = getExState(ex);
  const arr = liveSets[exId];

  if (getExerciseMode(ex).usesProgressiveSets) {
    const min = getSetsMin(ex), max = getSetsMax(ex);
    const newSets = Math.min(Math.max(s.sets + direction, min), max);
    if (newSets === s.sets) { alert(direction > 0 ? `Sets ceiling is ${max} (change it in Manage → Sets/Reps if you want higher).` : `Sets floor is ${min}.`); return; }
    s.sets = newSets;
  } else {
    const newSets = Math.max(1, ex.sets + direction);
    if (newSets === ex.sets) { alert('Minimum is 1 set.'); return; }
    ex.sets = newSets;
    persistDays();
  }

  if (arr) {
    const target = getTargetValue(ex);
    if (direction > 0) arr.push({ value: target, doneMark: false });
    else if (direction < 0 && arr.length > 1) arr.pop();
  }
  saveState();
  if (navigator.vibrate) navigator.vibrate(15);
  renderPreservingScroll(`card-${exId}`);
  persistLiveSets(exId);
}

function startWorkoutNow() {
  const today = dateStr(new Date());
  const dayLabel = DAYS[currentDayIdx].label;
  const countKey = `${today}__${dayLabel}`;
  state.sessionCount = state.sessionCount || {};
  state.sessionCount[countKey] = (state.sessionCount[countKey] || 0) + 1;
  state.sessionStarts = state.sessionStarts || {};
  state.sessionStarts[sessionKey(today, dayLabel, state.sessionCount[countKey])] = new Date().toISOString();
  saveState();
  if (navigator.vibrate) navigator.vibrate(20);
  render();
}

function markSessionStartIfNeeded() {
  const dayLabel = DAYS[currentDayIdx].label;
  const { anchorDate, sessionNum, key } = getActiveSession(dayLabel);
  state.sessionStarts = state.sessionStarts || {};
  if (!state.sessionStarts[key]) {
    // Subtract 2 minutes to account for the time spent actually performing this first set,
    // which happened before this "done" tap and would otherwise go uncounted.
    state.sessionStarts[key] = new Date(Date.now() - 2 * 60000).toISOString();
    // If this is the very first set of a brand-new (not-yet-started) session, also
    // register the session count so later lookups agree on which session this is.
    const countKey = `${anchorDate}__${dayLabel}`;
    state.sessionCount = state.sessionCount || {};
    if (!state.sessionCount[countKey]) state.sessionCount[countKey] = sessionNum;
    saveState();
  }
}

function markSetDone(exId, setIdx) {
  const arr = liveSets[exId];
  const set = arr[setIdx];
  set.doneMark = !set.doneMark;

  const ex = getExerciseById(exId);
  const day = DAYS[currentDayIdx];
  const isAlternatingSuperset = !!(ex && ex.supersetGroup && ex.supersetAlternate);
  // Mid-round: another group member hasn't logged its set at this same
  // index yet. Only meaningful the moment doneMark just became true — see
  // the sole call site below.
  let pendingPartner = null;

  if (set.doneMark) {
    // If this set finishes off the exercise AND every other exercise today is
    // already done, the whole workout is about to complete — there's nothing
    // left to rest for, so skip the timer instead of leaving one running with
    // no next set/exercise for it to lead into.
    const allSetsInThisExDone = arr.every(x => x.doneMark);
    const otherExercisesRemain = day.exercises.some(e => e.id !== exId && !isDoneToday(e.name, day.label));
    const isFinalSetOfWorkout = allSetsInThisExDone && !otherExercisesRemain;

    if (isAlternatingSuperset) {
      pendingPartner = getSupersetPartners(ex, day).find(p => {
        const parr = liveSets[p.id];
        return parr && parr[setIdx] && !parr[setIdx].doneMark;
      });
    }

    if (isFinalSetOfWorkout) {
      skipTimer(); // clear out any timer still running from an earlier set of this exercise — nothing left to rest for
    } else if (isAlternatingSuperset && pendingPartner) {
      // A partner still owes this same set index — no rest yet, you're
      // about to jump straight to their matching set below.
      skipTimer();
    } else if (isAlternatingSuperset && !allSetsInThisExDone) {
      // Every group member has now logged this index (round complete) and
      // this exercise still has more sets to go — this is the rest
      // *between rounds*, not the normal per-set rest.
      startTimerFor(exId, { round: true });
    } else {
      startTimerFor(exId);
    }
    markSessionStartIfNeeded();
    if (navigator.vibrate) navigator.vibrate(15);
  } else {
    clearInterval(timerInterval);
    timerInterval = null;
    const fab = document.getElementById('timerFab');
    fab.style.display = 'none';
    fab.classList.remove('urgent');
  }
  patchExerciseCard(exId);
  persistLiveSets(exId);

  // Jump straight to the partner's matching set (List Mode scrolls to it,
  // Focus Mode switches to it) — done after the render/persist above so the
  // just-logged set's own green "done" state is visible for a beat first.
  // focusOnExercise does its own full render when it switches the active
  // card, so this is unaffected by the card-scoped patch above.
  if (pendingPartner) focusOnExercise(pendingPartner.id);

  const allDone = arr.every(x => x.doneMark);
  if (allDone) {
    const exFull = getExerciseById(exId);
    setTimeout(() => { if (exFull) finishExercise(exFull); }, 250); // brief pause so the green "done" state is visible first
  }
}

let holdZeroTimer = null;
let holdZeroFired = false;

function startHoldZero(exId, setIdx) {
  holdZeroFired = false;
  holdZeroTimer = setTimeout(() => {
    holdZeroFired = true;
    const arr = liveSets[exId];
    arr[setIdx].value = 0;
    if (navigator.vibrate) navigator.vibrate([20,30,20]);
    flashSetChanged(exId, setIdx);
    renderPreservingScroll(`card-${exId}`);
    persistLiveSets(exId);
  }, 450);
}

function endHoldZero(exId, setIdx, delta) {
  clearTimeout(holdZeroTimer);
  if (!holdZeroFired) adjustSet(exId, setIdx, delta); // was a normal quick tap
}

function cancelHoldZero() {
  clearTimeout(holdZeroTimer);
}

function adjustSet(exId, setIdx, delta) {
  const arr = liveSets[exId];
  arr[setIdx].value = Math.max(0, arr[setIdx].value + delta);
  if (navigator.vibrate) navigator.vibrate(15);
  flashSetChanged(exId, setIdx);
  renderPreservingScroll(`card-${exId}`);
  persistLiveSets(exId);
}

function typeSet(exId, setIdx) {
  const arr = liveSets[exId];
  const current = arr[setIdx].value;
  const input = prompt('Enter actual value:', current);
  if (input === null) return;
  const n = parseInt(input);
  if (!isNaN(n)) { arr[setIdx].value = Math.max(0, n); flashSetChanged(exId, setIdx); }
  renderPreservingScroll(`card-${exId}`);
  persistLiveSets(exId);
}

function targetLabel(ex) {
  return getExerciseMode(ex).label(ex, getExState(ex));
}

function finishExercise(ex) {
  const arr = liveSets[ex.id];
  if (!arr) { alert('Nothing to log yet.'); return; }
  // Catches the classic mis-tap: hitting Finish before checking off any sets
  // would silently log the untouched default target as if it were actually
  // performed. One extra tap here only fires when that's actually about to
  // happen — the normal "check off sets, auto-advance" flow never sees it.
  if (arr.every(x => !x.doneMark)) {
    showConfirm({
      title: 'Finish without checking off sets?',
      message: `No sets are marked done for ${ex.name} yet. Finishing now logs the target — ${targetLabel(ex)} — as if that's exactly what you did. If that's not accurate, go back and check off your real sets first.`,
      confirmLabel: 'Log it anyway',
      danger: true,
      onConfirm: () => finishExerciseConfirmed(ex)
    });
    return;
  }
  finishExerciseConfirmed(ex);
}

function finishExerciseConfirmed(ex) {
  const arr = liveSets[ex.id];
  if (!arr) { alert('Nothing to log yet.'); return; }
  const mode = getExerciseMode(ex);
  const s = getExState(ex);
  const preFinishSnapshot = JSON.parse(JSON.stringify(s)); // for Undo
  const arrSnapshot = JSON.parse(JSON.stringify(arr)); // for Undo
  const hasSkippedSet = arr.some(x => x.value === 0);
  const success = mode.successCheck(s, arr);

  let statusMsg = '';
  let leveledUp = false;

  if (hasSkippedSet) {
    statusMsg = 'Set(s) logged as 0 (skipped) — progression left unchanged this session.';
  } else {
    const result = success ? mode.onSuccess(ex, s) : mode.onFail(ex, s);
    statusMsg = result.message;
    leveledUp = !!result.leveledUp;
  }

  const prevMax = getHistoricalMax(ex.name, ex.mode);
  // Use preFinishSnapshot (captured above, before onSuccess/onFail ran), not
  // the now-mutated `s` — onSuccess/onFail already bumped s.weight/
  // s.addedWeight up (level-up) or down (deload) to set up *next* session's
  // target. Reading the post-mutation value here would log this session's
  // history entry, and check it for a PR, against a weight that hasn't
  // actually been lifted yet.
  const sessionBest = mode.sessionBestValue(ex, preFinishSnapshot, arr);
  const isPR = !hasSkippedSet && prevMax !== null && sessionBest > prevMax;

  const activeSession = getActiveSession(DAYS[currentDayIdx].label);
  const pushedEntry = {
    date: new Date().toISOString(),
    sessionDate: activeSession.anchorDate,
    sessionNum: activeSession.sessionNum,
    day: DAYS[currentDayIdx].label,
    exercise: ex.name,
    mode: ex.mode,
    sets: arr.map(x => x.value),
    weight: mode.historyWeight(ex, preFinishSnapshot),
    success,
    skipped: hasSkippedSet,
    isPR
  };
  state.history.push(pushedEntry);
  let prEntry = null;
  if (isPR) {
    prEntry = recordPR(ex.name, sessionBest, mode.unit);
  }
  saveState();
  lastFinishUndo = { exId: ex.id, exName: ex.name, prevExState: preFinishSnapshot, arr: arrSnapshot, pushedEntry, prEntry };
  showUndoToast(`${ex.name}: ${statusMsg}${isPR ? ' 🏆 New PR!' : ''}`);
  delete liveSets[ex.id];
  persistLiveSets(ex.id);
  redoUnlocked.delete(ex.id); // back to locked/read-only after this log, even if this was a redo
  if (focusOverrideId === ex.id) focusOverrideId = null; // let focus mode auto-advance to the next incomplete exercise
  renderPreservingScroll(`card-${ex.id}`);
  const dayHasMoreToday = DAYS[currentDayIdx].exercises.some(e => !isDoneToday(e.name, DAYS[currentDayIdx].label));
  if (dayHasMoreToday) {
    const day = DAYS[currentDayIdx];
    const restSeconds = hasUnfinishedSupersetPartner(ex, day)
      ? (ex.supersetRest ?? 0) // short/no rest — moving straight to a superset partner
      : (ex.transitionRest ?? TRANSITION_REST_SECONDS);
    if (restSeconds > 0) startRestTimer(restSeconds);
  } else {
    // Every exercise in this group is done — the workout is complete.
    // Trigger the automatic local backup (if enabled) right here, before
    // anything async — that keeps the download inside the same
    // user-gesture call stack as the tap that finished this exercise, so
    // browsers treat it the same as tapping the manual Download button
    // instead of blocking it as an unsolicited background download.
    const backedUp = autoBackupOnWorkoutComplete();
    const { anchorDate, sessionNum } = getActiveSession(DAYS[currentDayIdx].label);
    const mins = getSessionDuration(anchorDate, DAYS[currentDayIdx].label, sessionNum);
    if (WORKOUT_FLOW.showCompletionModal) {
      setTimeout(() => showWorkoutCompleteModal(DAYS[currentDayIdx], mins, backedUp), WORKOUT_FLOW.autoAdvanceDelayMs);
    }
  }
  requestAnimationFrame(() => requestAnimationFrame(() => scrollToNextIncomplete(ex)));
  if (leveledUp) {
    const el = document.getElementById(`card-${ex.id}`);
    if (el) {
      el.classList.add('levelup');
      setTimeout(() => el.classList.remove('levelup'), 1000);
    }
  }
}

// Longest-streak tracking. Originally only updated at the exact moment the
// completion modal fired, which meant it could fall behind the real current
// streak indefinitely if that moment was ever missed (backfilled/edited
// history, a modal that didn't fire, etc.) — see syncLongestStreak() below,
// called on every render, for the fix. This function itself still just does
// the compare-and-store; the modal uses its return value to decide whether
// to show "new best!".
function checkAndUpdateLongestStreak(streak) {
  state.meta = state.meta || {};
  const prevBest = state.meta.longestStreak || 0;
  const isNewBest = streak > 0 && streak > prevBest;
  if (isNewBest) { state.meta.longestStreak = streak; saveState(); }
  return isNewBest;
}
// Keeps meta.longestStreak from silently falling behind the real current
// streak. Cheap to call on every render — it's a no-op (no write, no
// saveState) unless the current streak actually exceeds the stored best.
function syncLongestStreak() {
  checkAndUpdateLongestStreak(computeStreak());
}

// Lightweight count-up animation for the modal's stat numbers — 0 to target
// over ~700ms with an ease-out curve. Pure DOM/rAF, no dependency added.
function animateCountUp(el, target, { suffix = '', duration = 700 } = {}) {
  if (!el || !isFinite(target)) return;
  const start = performance.now();
  const from = 0;
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = Math.round(from + (target - from) * eased);
    el.textContent = val.toLocaleString() + suffix;
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Minimal CSS-confetti burst — plain divs animated via the confettiFall
// keyframes in <style>, removed after they finish falling. Only ever called
// for the three "worth celebrating" moments (new PR / new longest streak /
// 100% completion is implicit here since this modal only shows on full
// completion) so it never turns into visual noise on every workout.
function spawnConfetti(container) {
  const colors = ['#4f7cff', '#ff6b4a', '#3ecf6e', '#b06bff', '#ffcb4a'];
  for (let i = 0; i < 26; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random() * 0.3) + 's';
    piece.style.animationDuration = (1.6 + Math.random() * 0.9) + 's';
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 3000);
  }
}

// Full-screen celebration shown the moment every exercise in a workout group
// is finished. Reads already-computed stats plus the same dashboard/prediction
// helpers the Progress page uses (getOverallConsistencyPct, computeStreak,
// computeWorkoutScore, predictExercise) — nothing here recomputes logic that
// already exists elsewhere.
function showWorkoutCompleteModal(day, mins, backedUp = false) {
  document.getElementById('winModalOverlay')?.remove();
  const exCount = day.exercises.length;
  const setCount = day.exercises.reduce((sum, ex) => {
    const s = getExState(ex);
    return sum + (getExerciseMode(ex).usesProgressiveSets ? s.sets : ex.sets);
  }, 0);
  const durationLabel = mins != null ? formatDuration(mins) : '—';

  const { anchorDate, sessionNum } = getActiveSession(day.label);
  const todaysEntries = state.history.filter(h => getEntryDateKey(h) === anchorDate && h.day === day.label && getEntrySessionNum(h) === sessionNum);
  const totalVolume = Math.round(todaysEntries.reduce((sum, h) => sum + (h.weight && !h.skipped ? h.weight * h.sets.reduce((a,b)=>a+b,0) : 0), 0));
  const prsBroken = todaysEntries.filter(h => h.isPR).length;
  const avgRestSeconds = Math.round(day.exercises.reduce((sum, ex) => sum + (ex.rest || 60), 0) / Math.max(1, day.exercises.length));
  // Rough, clearly-labeled estimate only (≈6 kcal/min is a typical moderate
  // resistance-training MET value) — not a substitute for a real metabolic measurement.
  const estCalories = mins != null ? Math.round(mins * 6) : null;

  const consistencyPct = getOverallConsistencyPct();
  const streak = computeStreak();
  const isNewLongestStreak = checkAndUpdateLongestStreak(streak);
  const recovery = getRecoveryStatus(day.label);
  const score = computeWorkoutScore({ completionPct: 100, consistencyPct, streak, prsToday: prsBroken });
  const grade = scoreToGrade(score);

  // If this exercise-day has a weighted lift with an established trend,
  // surface how today's session moved its projection — reuses predictExercise,
  // nothing recomputed.
  const trendEx = day.exercises.find(ex => (ex.mode === 'weighted' || ex.mode === 'weighted_bw') && predictExercise(ex));
  const trendPred = trendEx ? predictExercise(trendEx) : null;
  const trend3mo = trendPred ? trendPred.projections.find(p => p.months === 3) : null;

  const overlay = document.createElement('div');
  overlay.className = 'win-overlay';
  overlay.id = 'winModalOverlay';
  overlay.innerHTML = `
    <div class="win-modal">
      <div class="win-emoji" id="winEmoji">✓</div>
      <div class="win-ring-wrap"><svg class="win-ring-svg" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" class="win-ring-track"/>
        <circle cx="40" cy="40" r="34" class="win-ring-fill" id="winRingFill"/>
      </svg><div class="win-ring-grade">${grade}</div></div>
      <h3 class="win-title">${escapeHtml(day.label)} complete!</h3>
      <div class="win-sub">Nice work — every exercise logged. Workout score ${score}/100.</div>
      <div class="win-stats">
        <div class="win-stat"><div class="win-stat-val" id="winDuration">—</div><div class="win-stat-label">Duration</div></div>
        <div class="win-stat"><div class="win-stat-val" id="winExCount">0</div><div class="win-stat-label">Exercises</div></div>
        <div class="win-stat"><div class="win-stat-val" id="winSetCount">0</div><div class="win-stat-label">Sets</div></div>
      </div>
      <div class="win-stats">
        <div class="win-stat"><div class="win-stat-val" id="winVolume">0</div><div class="win-stat-label">Volume (lb)</div></div>
        <div class="win-stat"><div class="win-stat-val">${formatDuration(Math.round(avgRestSeconds/60)) === '0 min' ? avgRestSeconds+'s' : formatDuration(Math.round(avgRestSeconds/60))}</div><div class="win-stat-label">Avg Rest</div></div>
        <div class="win-stat"><div class="win-stat-val" id="winCalories">0</div><div class="win-stat-label">Est. Calories</div></div>
      </div>
      <div class="win-stats">
        <div class="win-stat"><div class="win-stat-val">${prsBroken}${prsBroken ? ' 🏆' : ''}</div><div class="win-stat-label">PRs Broken</div></div>
        <div class="win-stat"><div class="win-stat-val">${consistencyPct != null ? consistencyPct+'%' : '—'}</div><div class="win-stat-label">Consistency</div></div>
        <div class="win-stat"><div class="win-stat-val">${streak}w 🔥</div><div class="win-stat-label">Streak${isNewLongestStreak ? ' (best!)' : ''}</div></div>
      </div>
      <div class="win-recovery">Recovery: <strong>${recovery.label}</strong></div>
      ${trend3mo ? `<div class="win-pred-update">🔮 Updated projection — ${escapeHtml(trendEx.name)}: ~${trend3mo.predictedWorkingWeight} lb in 3 months (${trend3mo.confidence}% confidence)</div>` : ''}
      ${backedUp ? `<div class="meta" style="margin:8px 0 0; text-align:center;">📥 Backed up locally</div>` : ''}
      <button class="btn" style="width:100%; margin-top:14px;" id="winModalCloseBtn">Nice!</button>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('#winModalCloseBtn').onclick = close;
  if (navigator.vibrate) navigator.vibrate([40, 60, 40, 60, 90]);

  // Animation sequence: ring fills, then stats count up, then (if earned) confetti.
  const ringFill = overlay.querySelector('#winRingFill');
  const circumference = 2 * Math.PI * 34;
  ringFill.style.strokeDasharray = `${circumference} ${circumference}`;
  ringFill.style.strokeDashoffset = circumference;
  requestAnimationFrame(() => {
    ringFill.style.transition = 'stroke-dashoffset 900ms cubic-bezier(.2,.8,.3,1)';
    ringFill.style.strokeDashoffset = circumference * (1 - score / 100);
  });
  setTimeout(() => {
    const durEl = overlay.querySelector('#winDuration');
    if (mins != null) animateCountUp(durEl, mins, { suffix: 'm' }); else durEl.textContent = '—';
    animateCountUp(overlay.querySelector('#winExCount'), exCount);
    animateCountUp(overlay.querySelector('#winSetCount'), setCount);
    animateCountUp(overlay.querySelector('#winVolume'), totalVolume);
    if (estCalories != null) animateCountUp(overlay.querySelector('#winCalories'), estCalories); else overlay.querySelector('#winCalories').textContent = '—';
  }, 500);
  if (prsBroken > 0 || isNewLongestStreak) {
    setTimeout(() => spawnConfetti(overlay), 250);
  }
}

// ---------- REST TIMER ----------
let restRemaining = 0;
let timerEndAt = null; // absolute Date.now()-based timestamp the running timer completes at
// A "hold" timer is the same countdown/FAB machinery, repurposed to time a
// single timed-hold set (e.g. plank) rather than the rest between sets.
// timerKind distinguishes which one is currently running so the FAB shows
// the right label and, on completion, a hold timer marks its specific set
// done instead of just going silent like a rest timer does.
let timerKind = 'rest';
let holdExId = null, holdSetIdx = null;
let holdStartSeconds = 0; // the target duration this hold set started at, captured once so later stepper taps on the set can't shift what "elapsed" means
function startRestTimer(seconds) {
  clearInterval(timerInterval);
  timerKind = 'rest';
  holdExId = null; holdSetIdx = null;
  restRemaining = seconds;
  timerEndAt = Date.now() + seconds * 1000;
  const fab = document.getElementById('timerFab');
  fab.style.display = 'flex';
  fab.classList.remove('urgent');
  applyTimerModeClass();
  updateFab();
  showExtendBtn();
  timerInterval = setInterval(tickTimer, 1000);
}

// Starts a countdown for one specific timed-hold set, defaulting to that
// set's current value — which is seeded from progression (getTargetValue)
// and can be nudged with the +/- steppers same as any other set. When it
// hits zero the set is auto-marked done, which flows straight into the
// normal rest-timer-before-next-set logic in markSetDone.
function startHoldTimer(exId, setIdx) {
  const arr = liveSets[exId];
  if (!arr || !arr[setIdx] || arr[setIdx].doneMark) return;
  const seconds = arr[setIdx].value;
  if (!seconds || seconds <= 0) return;
  clearInterval(timerInterval);
  timerKind = 'hold';
  holdExId = exId; holdSetIdx = setIdx;
  holdStartSeconds = seconds;
  restRemaining = seconds;
  timerEndAt = Date.now() + seconds * 1000;
  const fab = document.getElementById('timerFab');
  fab.style.display = 'flex';
  fab.classList.remove('urgent');
  applyTimerModeClass();
  updateFab();
  showExtendBtn();
  vibratePattern(20);
  renderPreservingScroll();
  timerInterval = setInterval(tickTimer, 1000);
}
// A plain decrementing counter drifts badly once setInterval gets throttled
// in a backgrounded tab (mobile browsers commonly drop it to ~once/minute
// or less) — restRemaining would keep counting down at the throttled rate
// instead of matching real elapsed time, so the alarm fires late and the
// displayed time is wrong when you switch back. Recomputing from an
// absolute end timestamp every tick makes it self-correcting: however late
// or infrequently this actually runs, it always reflects real time.
function tickTimer() {
  restRemaining = Math.max(0, Math.round((timerEndAt - Date.now()) / 1000));
  const fab = document.getElementById('timerFab');
  if (restRemaining <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;
    fab.style.display = 'none';
    fab.classList.remove('urgent');
    hideExtendBtn();
    syncWorkoutWakeLock(); // NOT a blind release — the workout session itself may still be in progress
    finalAlarm();
    if (timerKind === 'hold') completeHoldSet(holdExId, holdSetIdx);
  } else {
    updateFab();
    if (restRemaining <= getTimerWarningWindow()) {
      fab.classList.add('urgent');
      countdownTick();
    }
  }
}
// Backgrounded tabs can suspend/throttle both the countdown interval and
// the Web Audio context. On return, immediately reconcile against real
// elapsed time (tickTimer) instead of waiting for the next throttled tick —
// so a timer that finished while you were away fires its alarm the moment
// you're back, rather than staying silent or catching up late. Also nudges
// the audio context awake since some browsers keep it suspended after a
// background/foreground cycle even once the tab is active again.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && timerInterval) tickTimer();
});
function completeHoldSet(exId, setIdx) {
  timerKind = 'rest';
  holdExId = null; holdSetIdx = null;
  const arr = liveSets[exId];
  if (!arr || !arr[setIdx] || arr[setIdx].doneMark) return;
  markSetDone(exId, setIdx); // marks done + triggers the normal rest timer / finish flow
}
// Ends a hold early and logs however long was actually held, instead of
// discarding the set (skipTimer) or requiring the full target duration.
// Recomputes elapsed from the absolute end timestamp (same self-correcting
// approach as tickTimer) rather than trusting restRemaining, which only
// updates once a second. The partial value then flows through the normal
// set-done path, so it's still subject to the exercise's success/fail check
// (a short hold correctly counts as a miss for progression purposes).
function stopHoldTimer() {
  if (timerKind !== 'hold' || !holdExId) return;
  const exId = holdExId, setIdx = holdSetIdx;
  const remaining = Math.max(0, Math.round((timerEndAt - Date.now()) / 1000));
  const elapsed = Math.max(0, holdStartSeconds - remaining);
  clearInterval(timerInterval);
  timerInterval = null;
  const fab = document.getElementById('timerFab');
  fab.style.display = 'none';
  fab.classList.remove('urgent');
  hideExtendBtn();
  syncWorkoutWakeLock();
  const arr = liveSets[exId];
  if (arr && arr[setIdx] && !arr[setIdx].doneMark) {
    arr[setIdx].value = elapsed;
  }
  completeHoldSet(exId, setIdx);
}
function updateFab() {
  const fab = document.getElementById('timerFab');
  const m = Math.floor(restRemaining/60), s = restRemaining%60;
  fab.innerHTML = `<span class="fablabel">${timerKind === 'hold' ? 'HOLD' : 'REST'}</span>${m}:${s.toString().padStart(2,'0')}`;
}
// Hold timers get a bigger, green, centrally-floating look (you're mid-hold,
// not glancing at a phone corner); rest timers keep the small corner FAB.
// Reads the current global timerKind, so call it any time that's changed.
function applyTimerModeClass() {
  const isHold = timerKind === 'hold';
  document.getElementById('timerFab').classList.toggle('hold-mode', isHold);
  const btn = document.getElementById('timerExtendBtn');
  if (btn) btn.classList.toggle('hold-mode', isHold);
  const cancelBtn = document.getElementById('timerCancelBtn');
  if (cancelBtn) cancelBtn.classList.toggle('hold-mode', isHold);
}
// Adds time to whichever timer (rest or hold) is currently running. Reuses
// the same restRemaining/timerInterval the countdown already ticks on, so
// no separate state — the running interval just picks up the new value on
// its next tick.
function extendTimer(seconds) {
  if (!timerInterval) return;
  timerEndAt += seconds * 1000;
  restRemaining += seconds;
  const fab = document.getElementById('timerFab');
  fab.classList.remove('urgent');
  updateFab();
  vibratePattern(15);
}
function showExtendBtn() {
  const btn = document.getElementById('timerExtendBtn');
  if (btn) btn.style.display = 'flex';
  const cancelBtn = document.getElementById('timerCancelBtn');
  if (cancelBtn) cancelBtn.style.display = 'flex';
  const stopBtn = document.getElementById('timerStopBtn');
  if (stopBtn) stopBtn.style.display = (timerKind === 'hold') ? 'flex' : 'none';
}
function hideExtendBtn() {
  const btn = document.getElementById('timerExtendBtn');
  if (btn) btn.style.display = 'none';
  const cancelBtn = document.getElementById('timerCancelBtn');
  if (cancelBtn) cancelBtn.style.display = 'none';
  const stopBtn = document.getElementById('timerStopBtn');
  if (stopBtn) stopBtn.style.display = 'none';
}
function skipTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerKind = 'rest';
  holdExId = null; holdSetIdx = null;
  const fab = document.getElementById('timerFab');
  fab.style.display = 'none';
  fab.classList.remove('urgent');
  applyTimerModeClass();
  hideExtendBtn();
  syncWorkoutWakeLock(); // NOT a blind release — skipping a rest timer doesn't mean the workout is over
}

// ---------- SCREEN WAKE LOCK ----------
// Keeps the screen on for the whole span of an active workout — from the
// first set you log today until the day is fully complete — not just during
// rest/hold timers. Recomputed fresh on every render from actual state
// (session started + not yet 100% done) rather than toggled imperatively
// from scattered start/stop call sites, so it can't drift out of sync or
// have one code path release a lock another part of the app still wants
// held (e.g. a timer ending mid-workout used to kill the lock even though
// the workout itself wasn't over). The Wake Lock API needs no permission
// prompt but isn't universally supported (notably older Safari), so this
// fails silently where it's unavailable — the app already works fine
// without it, this just removes a common friction point where it's supported.
let wakeLockObj = null;
function getKeepScreenOnEnabled() {
  const v = localStorage.getItem('liftlog_keep_screen_on');
  return v === null ? true : v === '1';
}
function setKeepScreenOnEnabled(on) {
  localStorage.setItem('liftlog_keep_screen_on', on ? '1' : '0');
  syncWorkoutWakeLock();
  render();
}
async function requestWakeLock() {
  if (!getKeepScreenOnEnabled() || !('wakeLock' in navigator) || wakeLockObj) return;
  try {
    wakeLockObj = await navigator.wakeLock.request('screen');
  } catch(e) { wakeLockObj = null; }
}
function releaseWakeLock() {
  if (wakeLockObj) {
    wakeLockObj.release().catch(() => {});
    wakeLockObj = null;
  }
}
// The actual "should the screen be held on right now" decision: true from
// the moment today's session for the current day started until that day
// hits 100% complete. Call this any time something might have changed that —
// finishing a set, skipping/redoing an exercise, switching days, toggling
// the setting — rather than requesting/releasing directly from those places.
function syncWorkoutWakeLock() {
  const day = DAYS[currentDayIdx];
  if (!day) { releaseWakeLock(); return; }
  const { key } = getActiveSession(day.label);
  const started = !!(state.sessionStarts && state.sessionStarts[key]);
  const pct = getTodayCompletionPct(day);
  if (started && pct < 100) requestWakeLock();
  else releaseWakeLock();
}
// The wake lock is auto-released by the browser whenever the tab goes into
// the background, so it needs to be re-requested on return if a workout is
// still in progress.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') syncWorkoutWakeLock();
});

// Timer sound/vibration are separate per-device toggles (like theme/focus
// mode) covering the rest/hold timer's countdown tick and end-of-timer
// alarm — the alerts people are most likely to want to silence (e.g. in a
// quiet gym) independent of the tap-feedback haptics used elsewhere in the
// app. Both default on since that's the existing behavior.
function getTimerSoundEnabled() {
  const v = localStorage.getItem('liftlog_timer_sound');
  return v === null ? true : v === '1';
}
function setTimerSoundEnabled(on) {
  localStorage.setItem('liftlog_timer_sound', on ? '1' : '0');
  render();
}
function getTimerVibrationEnabled() {
  const v = localStorage.getItem('liftlog_timer_vibration');
  return v === null ? true : v === '1';
}
function setTimerVibrationEnabled(on) {
  localStorage.setItem('liftlog_timer_vibration', on ? '1' : '0');
  render();
}
function vibratePattern(pattern) {
  if (getTimerVibrationEnabled() && navigator.vibrate) navigator.vibrate(pattern);
}
// How many seconds before zero the FAB goes "urgent" (pulsing red) and
// starts ticking. Was a hardcoded 5; a couple of people want more (10s) or
// less (3s) warning depending on how far they typically are from the FAB.
function getTimerWarningWindow() {
  const v = localStorage.getItem('liftlog_timer_warning_window');
  const n = v === null ? 5 : parseInt(v, 10);
  return [3, 5, 10].includes(n) ? n : 5;
}
function setTimerWarningWindow(sec) {
  localStorage.setItem('liftlog_timer_warning_window', String(sec));
  render();
}

// One entry per selectable timer sound: the oscillator waveform plus the
// tick pitch and the (two-note, alternating) alarm pitches. Same
// one-object-per-variant shape as EXERCISE_MODES — add a new tone by adding
// one entry here, nothing else needs to change.
const TIMER_TONES = {
  classic: { name: 'Classic', type: 'square',   tickFreq: 1046, alarmFreqs: [1318, 988] },
  soft:    { name: 'Soft',    type: 'sine',     tickFreq: 784,  alarmFreqs: [988, 740] },
  digital: { name: 'Digital', type: 'sawtooth', tickFreq: 1568, alarmFreqs: [1760, 1318] },
  chime:   { name: 'Chime',   type: 'triangle', tickFreq: 1318, alarmFreqs: [1568, 1174] },
};
// Rest and hold timers can use different tones (so you can tell which one
// just ended without looking at the phone) — stored under separate keys.
// Falls back to the original single `liftlog_timer_tone` key so anyone who
// already picked a tone before this split keeps that choice for both.
function getTimerTone(kind) {
  const specific = localStorage.getItem(kind === 'hold' ? 'liftlog_timer_tone_hold' : 'liftlog_timer_tone_rest');
  if (TIMER_TONES[specific]) return specific;
  const legacy = localStorage.getItem('liftlog_timer_tone');
  return TIMER_TONES[legacy] ? legacy : 'classic';
}
function setTimerTone(kind, toneKey) {
  localStorage.setItem(kind === 'hold' ? 'liftlog_timer_tone_hold' : 'liftlog_timer_tone_rest', toneKey);
  render();
}
// Stored as 0-100 (a friendlier unit for a slider); applied to beep() as a
// 0-1 gain multiplier.
function getTimerVolume() {
  const v = localStorage.getItem('liftlog_timer_volume');
  const n = v === null ? 100 : parseInt(v, 10);
  return Number.isFinite(n) ? Math.min(100, Math.max(0, n)) : 100;
}
function setTimerVolume(pct) {
  localStorage.setItem('liftlog_timer_volume', String(Math.min(100, Math.max(0, Math.round(pct)))));
}
// Bound to the slider's oninput (fires continuously while dragging). A full
// render() here would destroy/recreate the slider mid-drag and cancel the
// gesture, so this just persists the value and patches the % label directly.
function setTimerVolumeLive(pct) {
  setTimerVolume(pct);
  const label = document.getElementById('timerVolumeLabel');
  if (label) label.textContent = Math.round(pct) + '%';
}
function beep(freq, gain, durationMs, type) {
  if (!getTimerSoundEnabled()) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const play = () => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = type || 'square';
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq; g.gain.value = gain * (getTimerVolume() / 100);
      o.start(); setTimeout(() => { o.stop(); ctx.close(); }, durationMs);
    };
    // Browsers commonly hand back a suspended context after a background/
    // foreground cycle, even once the tab is active again — resume() is a
    // no-op if it's already running, so this is safe to call unconditionally.
    if (ctx.state === 'suspended') ctx.resume().then(play).catch(() => {});
    else play();
  } catch(e) {}
}
function countdownTick() {
  // Sharp tick each second for the final stretch of the countdown
  const tone = TIMER_TONES[getTimerTone(timerKind)];
  beep(tone.tickFreq, 0.55, 150, tone.type);
  vibratePattern(180);
}
// ---------- SYSTEM NOTIFICATION (audible even when you've switched apps) ----------
// A Web Audio beep and navigator.vibrate() only work while the tab is in the
// foreground — the browser deliberately mutes/throttles a backgrounded tab,
// so there's no way to make those audible from another app. A system
// notification is the one thing that can: the OS plays its own sound/
// vibration for it regardless of which app is in front. Off by default
// since it requires a permission prompt.
function getTimerNotifyEnabled() {
  return localStorage.getItem('liftlog_timer_notify') === '1' && typeof Notification !== 'undefined' && Notification.permission === 'granted';
}
function setTimerNotifyEnabled(on) {
  if (!on) {
    localStorage.setItem('liftlog_timer_notify', '0');
    render();
    return;
  }
  if (typeof Notification === 'undefined') {
    alert('Notifications are not supported on this device/browser.');
    render();
    return;
  }
  if (Notification.permission === 'granted') {
    localStorage.setItem('liftlog_timer_notify', '1');
  } else if (Notification.permission === 'denied') {
    alert('Notifications are blocked for this app — enable them in your browser/device settings, then try again.');
  } else {
    Notification.requestPermission().then(perm => {
      localStorage.setItem('liftlog_timer_notify', perm === 'granted' ? '1' : '0');
      if (perm !== 'granted') alert('Notification permission was not granted.');
      render();
    });
    return; // render happens in the permission callback above
  }
  render();
}
function notifyTimerEnd(kind) {
  if (document.visibilityState === 'visible') return; // foreground alerts (sound/flash/vibrate) already cover this
  if (localStorage.getItem('liftlog_timer_notify') !== '1' || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try {
    new Notification(kind === 'hold' ? 'Hold complete' : 'Rest over', { body: 'LiftLog', tag: 'liftlog-timer', renotify: true });
  } catch(e) {}
}

function finalAlarm() {
  // Capture which timer this is for right away — completeHoldSet() (called
  // right after this returns, for hold timers) resets the global timerKind
  // to 'rest' before the alarm's beeps/speech have actually finished.
  const kind = timerKind;
  vibratePattern([500,150,500,150,500,150,500,150,700]);
  flashScreen();
  speakTimerEnd(kind);
  notifyTimerEnd(kind);
  const tone = TIMER_TONES[getTimerTone(kind)];
  let i = 0;
  const alarmInterval = setInterval(() => {
    beep(tone.alarmFreqs[i % 2], 0.85, 350, tone.type);
    i++;
    if (i >= 5) clearInterval(alarmInterval);
  }, 400);
}
// Lets Settings preview the current tone/volume on demand without waiting
// for a real timer to run down. Temporarily overrides the sound-enabled
// check so the preview plays even while the person is deciding whether to
// turn sound on.
function previewTimerSound(kind) {
  const wasEnabled = getTimerSoundEnabled();
  if (!wasEnabled) localStorage.setItem('liftlog_timer_sound', '1');
  const tone = TIMER_TONES[getTimerTone(kind)];
  beep(tone.tickFreq, 0.55, 150, tone.type);
  if (!wasEnabled) localStorage.setItem('liftlog_timer_sound', '0');
}

// ---------- SPOKEN ANNOUNCEMENT ----------
// Off by default — unlike sound/vibration this wasn't existing behavior,
// and a voice suddenly speaking is a bigger surprise than a beep, so it's
// opt-in rather than on-by-default.
function getTimerSpeechEnabled() {
  return localStorage.getItem('liftlog_timer_speech') === '1';
}
function setTimerSpeechEnabled(on) {
  localStorage.setItem('liftlog_timer_speech', on ? '1' : '0');
  render();
}
function speakTimerEnd(kind) {
  if (!getTimerSpeechEnabled() || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(kind === 'hold' ? 'Hold complete' : 'Rest over');
    u.volume = getTimerVolume() / 100;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}
function previewTimerSpeech() {
  if (!('speechSynthesis' in window)) { alert('Speech is not supported on this device/browser.'); return; }
  try {
    const u = new SpeechSynthesisUtterance('Rest over');
    u.volume = getTimerVolume() / 100;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

// ---------- VISUAL (SCREEN FLASH) ALARM ----------
// A brief full-screen flash when a timer ends — mainly for when sound and
// vibration are both off (silent gym, phone on Do Not Disturb) but the
// phone is still in view. Off by default for the same reason speech is:
// it's new, more attention-grabbing behavior than the app previously had.
function getTimerFlashEnabled() {
  return localStorage.getItem('liftlog_timer_flash') === '1';
}
function setTimerFlashEnabled(on) {
  localStorage.setItem('liftlog_timer_flash', on ? '1' : '0');
  render();
}
function flashScreen() {
  if (!getTimerFlashEnabled()) return;
  const el = document.createElement('div');
  el.className = 'timer-flash-overlay';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}
function previewTimerFlash() {
  const el = document.createElement('div');
  el.className = 'timer-flash-overlay';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ---------- RENDER ----------
function render() {
  const app = document.getElementById('app');
  try {
    if (view === 'workout') app.innerHTML = renderWorkout();
    else if (view === 'progress') app.innerHTML = renderProgress();
    else if (view === 'manage') app.innerHTML = renderManage();
    else if (view === 'settings') app.innerHTML = renderSettings();
    else app.innerHTML = renderHistory();

    if (view === 'progress') { setTimeout(renderCharts, 0); setTimeout(renderDurationRadarChart, 0); setTimeout(renderBodyweightChart, 0); }
    // Deliberately NOT called unconditionally here. scrollActiveTabsIntoView()
    // force-scrolls the page to reveal the tab strip if the active pill is
    // off-screen — correct right after an actual day/view switch, but render()
    // also runs on every single set logged/adjusted. Calling it here meant
    // that logging a set while scrolled down to see the tab strip (e.g. the
    // 4th+ exercise card) would yank the page back up toward the tabs on
    // every tap, fighting the scroll-preserving logic in
    // renderPreservingScroll(). Callers that actually change the selected
    // tab (setView, selectDay, selectProgressDay, selectProgressExercise,
    // initial boot) call scrollActiveTabsIntoView() themselves instead.
    syncWorkoutWakeLock();
  } catch (err) {
    console.error('LiftLog render error:', err);
    renderErrorFallback(app, err);
  }
}

// A render crash anywhere (corrupted state, a bad edge case, a bug) would
// otherwise leave a blank/frozen screen with no way to recover or even get
// your data out. This deliberately doesn't call any other render*/get*
// function — those might be what's broken — and is wrapped in its own
// try/catch as a last resort in case even this fails to build.
function renderErrorFallback(app, err) {
  try {
    app.innerHTML = `
      <div style="padding:24px 16px; text-align:center;">
        <div style="font-size:40px; margin-bottom:8px;">⚠️</div>
        <h3 style="margin:0 0 8px;">Something went wrong displaying this screen</h3>
        <div class="meta" style="margin-bottom:16px;">${escapeHtml(err && err.message ? err.message : String(err))}</div>
        <div style="display:flex; flex-direction:column; gap:8px; max-width:280px; margin:0 auto;">
          <button class="btn" onclick="safeSetView('workout')">Try Workout view</button>
          <button class="btn secondary" onclick="safeSetView('history')">Try History view</button>
          <button class="btn secondary" onclick="safeSetView('manage')">Try Manage view</button>
          <button class="btn secondary" onclick="safeExportBackup()">⬇ Export my data first</button>
          <button class="btn secondary" onclick="location.reload()">Reload App</button>
        </div>
      </div>`;
  } catch (e2) {
    app.textContent = "LiftLog hit an error and couldn't recover. Please reload the app.";
  }
}
function safeSetView(v) {
  try { setView(v); } catch (e) { console.error(e); }
}
function safeExportBackup() {
  try { exportBackup(); } catch (e) { console.error(e); alert('Export also failed: ' + (e.message || e)); }
}

// Keeps the currently-selected pill scrolled into view within its (horizontally
// scrollable) tab strip — e.g. after a swipe moves the selection off-screen.
function scrollTabIntoView(containerId, idx) {
  const container = document.getElementById(containerId);
  if (!container || idx < 0) return;
  const child = container.children[idx];
  if (!child) return;
  // Deliberately NOT using child.scrollIntoView() here: with block:'nearest'
  // it will also scroll the whole PAGE vertically if this tab strip happens
  // to be off-screen (e.g. right after a swipe restores scroll deep into a
  // card below) — which fights renderPreservingScroll's anchor restoration
  // and makes the swipe feel like it snaps/jumps. Scrolling the container's
  // own scrollLeft directly keeps this 100% horizontal, so it can never
  // move the page vertically.
  const containerRect = container.getBoundingClientRect();
  const childRect = child.getBoundingClientRect();
  const EDGE_PADDING = 8;
  if (childRect.left < containerRect.left) {
    container.scrollBy({ left: childRect.left - containerRect.left - EDGE_PADDING, behavior: 'smooth' });
  } else if (childRect.right > containerRect.right) {
    container.scrollBy({ left: childRect.right - containerRect.right + EDGE_PADDING, behavior: 'smooth' });
  }
}

function scrollActiveTabsIntoView() {
  if (view === 'workout') {
    scrollTabIntoView('workoutDayTabs', currentDayIdx);
  } else if (view === 'progress') {
    scrollTabIntoView('progressDayTabs', progressDayIdx);
    const progDay = DAYS[progressDayIdx];
    const exIdx = progDay ? progDay.exercises.findIndex(e => e.id === progressExerciseId) : -1;
    scrollTabIntoView('progressExerciseTabs', exIdx);
  }
}

// Renders one exercise's full interactive card. Used by both List Mode (every
// exercise, one after another) and Focus Mode (just the single active one),
// so the actual set-logging UI only exists in one place. `highlighted` adds
// the "this is the one to do right now" styling used in Focus Mode.
function renderExerciseCard(ex, day, { highlighted = false } = {}) {
  const doneToday = isDoneToday(ex.name, day.label);

  // Once an exercise is logged for today, lock it to a compact, read-only
  // summary instead of leaving the full Finish/Skip controls live. This is
  // what stops a stray tap in the full list from quietly creating a second,
  // duplicate log entry for the same exercise. "Redo" is one deliberate,
  // confirmed step away if a real correction is needed.
  if (doneToday && !redoUnlocked.has(ex.id)) {
    const logged = getTodayLoggedEntry(ex, day);
    const loggedLabel = logged ? formatLoggedEntry(logged) : targetLabel(ex);
    const ssColor = ex.supersetGroup ? getSupersetColor(day, ex.supersetGroup) : null;
    return `<div class="card done-today card-locked" style="border-left:3px solid ${day.color};${ssColor ? ` border-top:3px solid ${ssColor};` : ''}" id="card-${ex.id}">
      ${diagramThumbHtml(ex)}
      ${ssColor ? `<div class="focus-eyebrow" style="color:${ssColor};">⚡ Superset ${getSupersetLabel(day, ex.supersetGroup)}</div>` : ''}
      <div class="row">
        <h3>✅ ${escapeHtml(ex.name)}${isExerciseLinked(ex.id) ? ` <span class="badge linked" title="Also on: ${escapeHtml(getLinkedDayLabel(ex.id, currentDayIdx) || '')}">🔗</span>` : ''}</h3>
        <button class="btn small secondary" onclick="unlockExerciseForRedo('${ex.id}')">↻ Redo</button>
      </div>
      <div class="meta">Logged: ${escapeHtml(loggedLabel)}</div>
      <div class="meta" style="margin-bottom:0; color:var(--text-faint);">Next: ${escapeHtml(targetLabel(ex))}</div>
    </div>`;
  }

  const s = getExState(ex);
  const arr = ensureLive(ex);
  const step = getExerciseMode(ex).stepSize ?? 1;
  const setsHtml = arr.map((set, i) => {
    const isChanged = recentlyChangedSet && recentlyChangedSet.exId === ex.id && recentlyChangedSet.setIdx === i;
    const isHolding = timerKind === 'hold' && holdExId === ex.id && holdSetIdx === i;
    const holdBtn = ex.mode === 'timed' && !set.doneMark
      ? `<button class="stepbtn holdbtn" onclick="startHoldTimer('${ex.id}', ${i})" title="Start ${set.value}s hold timer">${isHolding ? '⏱' : '▶'}</button>`
      : '';
    return `<div class="setbox ${set.doneMark?'done':''} ${isChanged?'changed':''}">
      <button class="stepbtn"
        onpointerdown="startHoldZero('${ex.id}', ${i})"
        onpointerup="endHoldZero('${ex.id}', ${i}, -${step})"
        onpointerleave="cancelHoldZero()"
        onpointercancel="cancelHoldZero()">−</button>
      <span class="setval" onclick="typeSet('${ex.id}', ${i})">${set.value}</span>
      <button class="stepbtn" onclick="adjustSet('${ex.id}', ${i}, ${step})">+</button>
      <button class="donebtn" onclick="markSetDone('${ex.id}', ${i})">${set.doneMark?'✓':'Done'}</button>
      ${holdBtn}
    </div>`;
  }).join('');

  const badge = s.failStreak > 0 ? `<span class="badge deload">${s.failStreak}/${getFailThreshold(ex)} missed</span>` : `<span class="badge up">on track</span>`;

  const exMode = getExerciseMode(ex);
  const weightControl = exMode.hasWeightControl
    ? `<div class="livectrl">
        <span class="livectrl-label">Weight</span>
        <button class="stepbtn" onclick="adjustWeightLive('${ex.id}', -1)">−</button>
        <span class="livectrl-val" onclick="editWeightLive('${ex.id}')" style="cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px;" title="Tap to type an exact weight">${exMode.weightLabel(ex, s)}</span>
        <button class="stepbtn" onclick="adjustWeightLive('${ex.id}', 1)">+</button>
      </div>` : '';

  const setsControl = `<div class="livectrl">
        <span class="livectrl-label">Sets</span>
        <button class="stepbtn" onclick="adjustSetsLive('${ex.id}', -1)">−</button>
        <span class="livectrl-val">${exMode.usesProgressiveSets ? s.sets : ex.sets}</span>
        <button class="stepbtn" onclick="adjustSetsLive('${ex.id}', 1)">+</button>
      </div>`;

  const ssColor = ex.supersetGroup ? getSupersetColor(day, ex.supersetGroup) : null;
  const ssPartners = ex.supersetGroup ? getSupersetPartners(ex, day) : [];
  return `<div class="card ${doneToday?'done-today':''} ${highlighted?'card-focus':''}" style="border-left:3px solid ${day.color};${ssColor ? ` border-top:3px solid ${ssColor};` : ''}" id="card-${ex.id}">
    ${diagramThumbHtml(ex)}
    ${ssColor ? `<div class="focus-eyebrow" style="color:${ssColor};">⚡ Superset ${getSupersetLabel(day, ex.supersetGroup)} — with ${ssPartners.map(p => escapeHtml(p.name)).join(', ')}</div>` : ''}
    ${highlighted ? `<div class="focus-eyebrow">Now training</div>` : ''}
    ${doneToday ? `<div class="focus-eyebrow" style="color:var(--danger);">Redo unlocked — this will add a second log entry</div>` : ''}
    <div class="row"><h3>${doneToday?'✅ ':''}${escapeHtml(ex.name)}${isExerciseLinked(ex.id) ? ` <span class="badge linked" title="Also on: ${escapeHtml(getLinkedDayLabel(ex.id, currentDayIdx) || '')}">🔗</span>` : ''}</h3>${badge}</div>
    ${ex.notes ? `<div class="meta" style="font-style:italic;">📝 ${escapeHtml(ex.notes)}</div>` : ''}
    <div class="meta">Target: ${targetLabel(ex)}</div>
    ${(() => {
      const last = getLastLoggedEntry(ex);
      return last ? `<div class="meta" style="color:var(--text-faint);">Last: ${escapeHtml(formatLoggedEntry(last))}</div>` : '';
    })()}
    <div class="row" style="margin-bottom:10px; gap:16px;">${weightControl}${setsControl}</div>
    <div class="sets${ex.mode === 'timed' ? ' sets-timed' : ''}">${setsHtml}</div>
    <div class="row" style="margin-top:10px;">
      <button class="btn small secondary" onclick="matchLastSet('${ex.id}')">Match last set</button>
      <button class="btn small secondary" onclick="skipExercise('${ex.id}')">Skip</button>
      <button class="btn small" onclick="finishExercise(DAYS[${currentDayIdx}].exercises.find(e=>e.id==='${ex.id}'))">Finish</button>
    </div>
  </div>`;
}

// Session-only set of exercise IDs the user has explicitly chosen to re-log
// today, after an interstitial warning. Never persisted — a fresh page load
// always starts every completed exercise back in its locked state.
let redoUnlocked = new Set();

// Most recent logged entry for this exercise, regardless of which day tab
// it was logged under — a linked exercise progresses as one continuous
// thing across whichever days it appears on, so "last time" should mean
// the last time you actually did it, not last time on this specific tab.
function formatLoggedEntry(h) {
  return `${h.sets.join(', ')}${h.weight != null ? ' @ ' + h.weight + ' lb' : ''}${h.skipped ? ' (skipped)' : ''}`;
}

function getLastLoggedEntry(ex) {
  for (let i = state.history.length - 1; i >= 0; i--) {
    const h = state.history[i];
    if (h.exercise === ex.name) return h;
  }
  return null;
}

function getTodayLoggedEntry(ex, day) {
  const { anchorDate, sessionNum } = getActiveSession(day.label);
  for (let i = state.history.length - 1; i >= 0; i--) {
    const h = state.history[i];
    if (h.exercise === ex.name && h.day === day.label && getEntryDateKey(h) === anchorDate && getEntrySessionNum(h) === sessionNum) return h;
  }
  return null;
}

function unlockExerciseForRedo(exId) {
  const ex = getExerciseById(exId);
  showConfirm({
    title: 'Log this again?',
    message: `${ex ? ex.name : 'This exercise'} is already logged for today. Doing it again adds a SECOND entry — it'll count twice toward today's volume and duration. Only do this to fix a mistake.`,
    confirmLabel: 'Unlock to redo',
    danger: true,
    onConfirm: () => { redoUnlocked.add(exId); renderPreservingScroll(`card-${exId}`); }
  });
}

// A tappable dot rail summarizing every exercise in the group at a glance —
// done (✓), the one currently active (glowing ring), and everything still
// upcoming (dim). Tapping a dot jumps Focus Mode to preview that exercise.
function renderProgressRail(day, activeExId) {
  const dots = day.exercises.map(ex => {
    const done = isDoneToday(ex.name, day.label);
    const active = ex.id === activeExId;
    const cls = done ? 'railstop done' : active ? 'railstop active' : 'railstop';
    const label = done ? '✓' : '';
    return `<div class="${cls}" style="${active ? `--rail-color:${day.color};` : ''}" onclick="focusOnExercise('${ex.id}')" title="${escapeHtml(ex.name)}">${label}</div>`;
  }).join('');
  return `<div class="progress-rail">${dots}</div>`;
}

// Manual override so a lazy tap on the progress rail (or an "Up Next" preview)

let focusOverrideId = null;
function focusOnExercise(exId) {
  focusOverrideId = exId;
