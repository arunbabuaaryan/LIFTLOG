function renderWorkout() {
  const tabs = DAYS.map((d,i) => {
    const pct = getTodayCompletionPct(d);
    const active = i === currentDayIdx;
    const tabStyle = active ? `background:${d.color}; color:#fff;` : '';
    const todayKey = dateStr(new Date());
    const sessionsToday = getSessionCount(todayKey, d.label);
    const sessionTag = sessionsToday > 1 ? `<span class="badge" style="padding:1px 6px; font-size:9.5px;">×${sessionsToday}</span>` : '';
    return `<div class="tab" style="${tabStyle}" onclick="selectDay(${i})">
      ${d.icon} ${escapeHtml(d.label)} ${sessionTag}
      <span class="ring" style="background: conic-gradient(${d.color} ${pct*3.6}deg, var(--ring-track) 0deg)"><span class="ring-inner">${pct === 100 ? '✓' : ''}</span></span>
    </div>`;
  }).join('');

  const streakEl = document.getElementById('streakBadge');
  if (streakEl) {
    const streak = computeStreak();
    checkAndUpdateLongestStreak(streak);
    const thisWeek = getWeekWorkoutGroupCount(getWeekKey(new Date()));
    const weekPart = `${thisWeek}/${DAYS.length} muscle groups this week`;
    streakEl.textContent = streak > 0 ? `🔥 ${streak} week streak · ${weekPart}` : weekPart;
  }

  const day = DAYS[currentDayIdx];
  const activeSessionInfo = getActiveSession(day.label);
  const sessionStart = state.sessionStarts && state.sessionStarts[activeSessionInfo.key];
  const pct = getTodayCompletionPct(day);
  const sessionComplete = sessionStart && pct === 100;
  const startedLabel = sessionStart
    ? `✅ Started at ${new Date(sessionStart).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${activeSessionInfo.sessionNum > 1 ? ` (session ${activeSessionInfo.sessionNum})` : ''}`
    : '';
  const startBar = !sessionStart
    ? `<div class="card" style="text-align:center; padding:10px;">
        <button class="btn" onclick="startWorkoutNow()" style="width:100%;">▶ Begin Workout</button>
        <div class="meta" style="margin-top:6px; margin-bottom:0;">Tap when you walk in for the most accurate session time</div>
      </div>`
    : sessionComplete
      ? `<div class="card" style="text-align:center; padding:10px;">
          <span class="badge up">${startedLabel}</span>
          <div style="margin-top:8px;"><button class="btn small secondary" onclick="startWorkoutNow()">↻ Start Another Session Today</button></div>
        </div>`
      : `<div class="card" style="text-align:center; padding:10px;"><span class="badge up">${startedLabel}</span></div>`;

  const completeBanner = pct === 100
    ? `<div class="card complete-banner">🎉 ${escapeHtml(day.label)} workout completed!</div>`
    : '';

  const modeToggle = `<div class="focus-toggle" onclick="setFocusMode(${!getFocusMode()})" title="${getFocusMode() ? 'Switch to full list' : 'Switch to guided focus mode'}">${getFocusMode() ? '🎯 Focus' : '☰ List'}</div>`;

  let body;
  if (getFocusMode() && day.exercises.length > 0 && pct < 100) {
    // ---- FOCUS MODE: one exercise at a time, no scrolling required ----
    const incomplete = day.exercises.filter(ex => !isDoneToday(ex.name, day.label));
    const overrideValid = focusOverrideId && incomplete.some(ex => ex.id === focusOverrideId);
    const activeEx = overrideValid ? incomplete.find(ex => ex.id === focusOverrideId) : incomplete[0];
    if (!overrideValid) focusOverrideId = null;
    const activeIdx = day.exercises.findIndex(e => e.id === activeEx.id);
    const upNext = day.exercises.slice(activeIdx + 1).filter(ex => !isDoneToday(ex.name, day.label)).slice(0, WORKOUT_FLOW.upNextPreviewCount);
    const doneCount = day.exercises.length - incomplete.length;

    const upNextHtml = upNext.length ? `<div class="upnext-row" onclick="focusOnExercise('${upNext[0].id}')">
        <span class="upnext-label">Up next</span>
        <span class="upnext-name">${escapeHtml(upNext[0].name)}</span>
        <span class="upnext-arrow">→</span>
      </div>` : '';

    const completedHtml = doneCount > 0 ? `<details class="completed-collapse">
        <summary>✅ Completed (${doneCount}/${day.exercises.length})</summary>
        ${day.exercises.filter(ex => isDoneToday(ex.name, day.label)).map(ex => `<div class="completed-row">${escapeHtml(ex.name)} <span class="badge up">done</span></div>`).join('')}
      </details>` : '';

    body = `${renderProgressRail(day, activeEx.id)}
      ${completedHtml}
      ${renderExerciseCard(activeEx, day, { highlighted: true })}
      ${upNextHtml}`;
  } else {
    // ---- LIST MODE (or workout already complete): everything at once ----
    body = day.exercises.map(ex => renderExerciseCard(ex, day)).join('');
  }

  return `<div class="tabs" id="workoutDayTabs">${tabs}</div><main>${startBar}${completeBanner}${modeToggle}${body}</main>`;
}

// A "session" is currently identified by (calendar date, workout day, session
// number) — but older/simpler history entries don't carry a distinct session
// number, so if you log a workout in two separate real-world sittings on the
// same calendar date (e.g. abs in the afternoon, forearms that evening), both
// sittings land under the same session bucket. Taking a flat max-minus-min
// timestamp span across that whole bucket then reports an absurd multi-hour
// "duration" — the gap between sittings, not any actual workout. Splitting on
// any gap this large and keeping only the largest contiguous cluster fixes
// that without touching session identity anywhere else in the app (today's-
// completion checks, redo, etc. all still key off the original grouping).
const MAX_SESSION_GAP_MINUTES = 120;
function computeSessionSpanMinutes(times) {
  const sorted = [...times].sort((a,b) => a - b);
  let clusters = [[sorted[0]]];
  for (let i = 1; i < sorted.length; i++) {
    const gapMin = (sorted[i] - sorted[i-1]) / 60000;
    if (gapMin > MAX_SESSION_GAP_MINUTES) clusters.push([sorted[i]]);
    else clusters[clusters.length - 1].push(sorted[i]);
  }
  clusters.sort((a,b) => b.length - a.length || (Math.max(...b)-Math.min(...b)) - (Math.max(...a)-Math.min(...a)));
  const best = clusters[0];
  if (best.length < 2) return null; // largest real cluster still isn't enough to time a workout
  return Math.round((Math.max(...best) - Math.min(...best)) / 60000);
}

// Every unique session logged for one specific workout group (day), each with
// its resolved duration (override if set, else timestamp-derived). Shared by
// getMuscleGroupDurationStats (aggregate) and the per-day duration history
// modal (drill-down) so they can never disagree with each other.
function getDaySessionsWithDuration(dayLabel) {
  const day = DAYS.find(d => d.label === dayLabel);
  const { anchorDate: curAnchor, sessionNum: curSessionNum } = getActiveSession(dayLabel);
  const currentIsIncomplete = day ? getTodayCompletionPct(day) < 100 : false;
  const currentHasOverride = getDurationOverride(curAnchor, dayLabel, curSessionNum) != null;

  const seen = new Map();
  state.history.filter(h => h.day === dayLabel).forEach(h => {
    const dk = getEntryDateKey(h);
    const num = getEntrySessionNum(h);
    const key = dk + '__s' + num;
    if (!seen.has(key)) seen.set(key, { dateKey: dk, sessionNum: num });
  });
  let sessions = [...seen.values()].sort((a,b) => a.dateKey.localeCompare(b.dateKey) || a.sessionNum - b.sessionNum);
  if (currentIsIncomplete && !currentHasOverride) {
    sessions = sessions.filter(s => !(s.dateKey === curAnchor && s.sessionNum === curSessionNum));
  }
  return sessions.map(({dateKey, sessionNum}) => ({
    dateKey, sessionNum, mins: getSessionDuration(dateKey, dayLabel, sessionNum)
  }));
}

function getMuscleGroupDurationStats(dayLabel) {
  // Use the exact same duration function as the completion modal and the
  // duration-edit screen (override, else sessionStart-aware span) — this
  // used to reimplement its own span calc from raw entry timestamps only,
  // which skipped sessionStart and so under-counted vs. what the modal shows.
  const durationsWithDate = getDaySessionsWithDuration(dayLabel)
    .filter(d => d.mins != null)
    .map(d => ({ date: d.dateKey, mins: d.mins }));
  if (durationsWithDate.length === 0) return null;
  const durations = durationsWithDate.map(d => d.mins);
  const mean = Math.round(durations.reduce((a,b) => a+b, 0) / durations.length);
  const last = durationsWithDate[durationsWithDate.length - 1];
  return { mean, min: Math.min(...durations), max: Math.max(...durations), count: durations.length, last: last.mins, lastDate: last.date };
}

// Total volume (weight × reps, summed across sets and across every weighted
// exercise) logged in one session. Bodyweight/timed-mode entries have no
// h.weight and are skipped — "volume" as a concept only really applies to
// external load.
function getSessionVolume(dateKey, dayLabel, sessionNum) {
  const entries = state.history.filter(h => getEntryDateKey(h) === dateKey && h.day === dayLabel && getEntrySessionNum(h) === sessionNum && h.weight != null && !h.skipped);
  if (!entries.length) return null;
  return Math.round(entries.reduce((sum, h) => sum + h.weight * h.sets.reduce((a,b) => a+b, 0), 0));
}
// Same session-grouping/incomplete-session handling as getMuscleGroupDurationStats,
// aggregated into total training volume instead of time — this is the "am I
// actually moving more weight overall" number that a single exercise's chart
// can't show on its own.
// ---------- BODYWEIGHT TRACKING ----------
// Separate from any exercise's progression weight — a simple standalone log
// of your own bodyweight over time. One entry per calendar date; logging
// again on the same day overwrites that day's entry rather than adding a
// second one.

// default to their last-used unit. Every display point converts to show
// both units regardless of what's stored.

function getBodyweightLog() {

}

function deleteBodyweightEntry(dateIso) {

function getBodyweightStats() {

let bodyweightLogListOpen = false;

// ---------- BODY MEASUREMENTS TRACKING ----------
// Same one-entry-per-calendar-date pattern as bodyweight, but each entry
// holds a `values` object keyed by body part, since a person taps one part
// at a time on the diagram rather than filling in everything at once.
// Values are always stored canonically in cm; `state.measurementsUnit` just
// records which unit was last used so inputs default sensibly. Display
// always shows both units, same as bodyweight's bothUnits().
const MEASUREMENT_PARTS = [
  { key: 'neck', label: 'Neck' },
  { key: 'shoulders', label: 'Shoulders' },
  { key: 'chestLats', label: 'Chest / Lats' },
  { key: 'waist', label: 'Waist' },
  { key: 'hips', label: 'Hips' },
  { key: 'armsR', label: 'Right Arm' },
  { key: 'armsL', label: 'Left Arm' },
  { key: 'forearmsR', label: 'Right Forearm' },
  { key: 'forearmsL', label: 'Left Forearm' },
  { key: 'wristR', label: 'Right Wrist' },
  { key: 'wristL', label: 'Left Wrist' },
  { key: 'thighsR', label: 'Right Thigh' },
  { key: 'thighsL', label: 'Left Thigh' },
  { key: 'calvesR', label: 'Right Calf' },
  { key: 'calvesL', label: 'Left Calf' },
];
// Body parts that come in left/right pairs, in the order they should be
// displayed together (right first, then left) — see measurementsGridHtml.
const MEASUREMENT_LR_PAIRS = [
  ['armsR', 'armsL'], ['forearmsR', 'forearmsL'], ['wristR', 'wristL'],
  ['thighsR', 'thighsL'], ['calvesR', 'calvesL'],
];
const CM_PER_IN = 2.54;
function cmToIn(cm) { return cm / CM_PER_IN; }
function inToCm(inch) { return inch * CM_PER_IN; }
function fmtMeasure1(n) { return Math.round(n * 10) / 10; }
function bothMeasureUnits(cm) { return `${fmtMeasure1(cm)} cm (${fmtMeasure1(cmToIn(cm))} in)`; }

function getMeasurementsLog() {
  return (state.measurementsLog || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
}
function getTodaysMeasurementEntry() {
  const today = dateStr(new Date());
  return (state.measurementsLog || []).find(e => dateStr(e.date) === today) || null;
}
function getLatestMeasurementValue(key) {
  const log = getMeasurementsLog();
  for (let i = log.length - 1; i >= 0; i--) {
    if (log[i].values && log[i].values[key] != null) return { value: log[i].values[key], date: log[i].date };
  }
  return null;
}
function getMeasurementsStats() {
  const log = getMeasurementsLog();
  const loggedParts = MEASUREMENT_PARTS.filter(p => getLatestMeasurementValue(p.key));
  if (!loggedParts.length) return null;
  const mostRecentDate = log.length ? log[log.length - 1].date : null;
  return { loggedCount: loggedParts.length, totalCount: MEASUREMENT_PARTS.length, mostRecentDate };
}
// Every logged {date, value} pair for one body part, oldest first.
function getMeasurementHistoryForPart(key) {
  return getMeasurementsLog()
    .filter(e => e.values && e.values[key] != null)
    .map(e => ({ date: e.date, value: e.values[key] }));
}
// Latest value plus the change vs. the entry logged just before it, so the
// grid and the part modal can both show "current vs previous" at a glance.
function getMeasurementTrend(key) {
  const hist = getMeasurementHistoryForPart(key);
  if (!hist.length) return null;
  const latest = hist[hist.length - 1];
  const previous = hist.length > 1 ? hist[hist.length - 2] : null;
  const change = previous ? fmtMeasure1(latest.value - previous.value) : null;
  return { latest, previous, change };
}
// % change vs. the entry logged ~60 days before the latest one, for that
// body part. If there's no entry that old yet, falls back to the oldest
// entry on file instead — so a comparison still shows up before 60 days of
// history exist — but never reaches further back than 60 days when an
// entry near that mark is actually available.
function getMeasurement60DayChange(key) {
  const hist = getMeasurementHistoryForPart(key);
  if (hist.length < 2) return null;
  const latest = hist[hist.length - 1];
  const latestTime = new Date(latest.date).getTime();
  const targetTime = latestTime - 60 * 24 * 60 * 60 * 1000;
  let baseline = null;
  for (let i = hist.length - 2; i >= 0; i--) {
    if (new Date(hist[i].date).getTime() <= targetTime) { baseline = hist[i]; break; }
  }
  if (!baseline) baseline = hist[0];
  if (baseline === latest || !baseline.value) return null;
  const days = Math.round((latestTime - new Date(baseline.date).getTime()) / (24 * 60 * 60 * 1000));
  if (days < 1) return null;
  const pct = Math.round(((latest.value - baseline.value) / baseline.value) * 1000) / 10;
  const pctText = `${pct > 0 ? '▲+' : pct < 0 ? '▼' : '–'}${Math.abs(pct)}%`;
  return { pct, pctText, days };
}

// ---------- LEFT / RIGHT SYMMETRY ----------
// Compares the latest logged value on each side of every bilateral part.
// diff > 0 means left is bigger, diff < 0 means right is bigger.
const SYMMETRY_PAIRS = [
  { left: 'armsL', right: 'armsR', label: 'Arms' },
  { left: 'forearmsL', right: 'forearmsR', label: 'Forearms' },
  { left: 'wristL', right: 'wristR', label: 'Wrist' },
  { left: 'thighsL', right: 'thighsR', label: 'Thighs' },
  { left: 'calvesL', right: 'calvesR', label: 'Calves' },
];
function getSymmetryChecks() {
  return SYMMETRY_PAIRS.map(p => {
    const l = getLatestMeasurementValue(p.left);
    const r = getLatestMeasurementValue(p.right);
    if (!l || !r) return { label: p.label, available: false };
    return { label: p.label, available: true, diff: fmtMeasure1(l.value - r.value) };
  });
}

// ---------- MEDIA STORAGE (IndexedDB) ----------
// Progress-photo (and, later, workout-diagram) image blobs live here instead
// of inline in `state`/localStorage. localStorage has a hard ~5-10MB quota
// shared with all the rest of the app's data and gets re-serialized on
// *every* saveState() call, so a handful of base64 photos in there risked
// silently breaking every save once the quota was hit. IndexedDB gives
// PWAs a much larger budget and stores binary blobs natively — no base64
// inflation, no coupling to unrelated saves.
const MEDIA_DB_NAME = 'liftlog_media_db';
const MEDIA_DB_VERSION = 1;
const MEDIA_STORE_NAME = 'photos';
let _mediaDbPromise = null;
function openMediaDb() {
  if (_mediaDbPromise) return _mediaDbPromise;
  _mediaDbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB not available on this browser')); return; }
    const req = indexedDB.open(MEDIA_DB_NAME, MEDIA_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(MEDIA_STORE_NAME)) db.createObjectStore(MEDIA_STORE_NAME);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Could not open media database'));
  });
  return _mediaDbPromise;
}
function idbPutMedia(id, blob) {
  return openMediaDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE_NAME, 'readwrite');
    tx.objectStore(MEDIA_STORE_NAME).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('Could not save image'));
  }));
}
function idbGetMedia(id) {
  return openMediaDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE_NAME, 'readonly');
    const req = tx.objectStore(MEDIA_STORE_NAME).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error || new Error('Could not load image'));
  }));
}
function idbDeleteMedia(id) {
  return openMediaDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE_NAME, 'readwrite');
    tx.objectStore(MEDIA_STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('Could not delete image'));
  }));
}
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('Could not read image'));
    reader.readAsDataURL(blob);
  });
}
function dataUrlToBlob(dataUrl) {
  return fetch(dataUrl).then(r => r.blob());
}

// In-memory cache of media id -> object URL. Populated lazily so the
// (synchronous) render pipeline never has to await an IndexedDB read: a
// not-yet-cached image renders as a 1x1 transparent placeholder, and the
// moment its blob finishes loading the already-painted DOM nodes for that
// id get their src/background-image patched directly in place — no
// render()/renderPreservingScroll() call involved.
const mediaUrlCache = {};

function getMediaUrl(id) {
  if (mediaUrlCache[id]) return mediaUrlCache[id];
  loadMediaIntoCache(id);

}
function loadMediaIntoCache(id) {
  if (mediaUrlCache[id] === null) return; // already tried + missing, don't hammer IndexedDB on every render

    if (!blob) { mediaUrlCache[id] = null; return; }
    mediaUrlCache[id] = URL.createObjectURL(blob);
    patchMediaNodesInPlace(id, mediaUrlCache[id]);

function patchMediaNodesInPlace(id, url) {
  document.querySelectorAll(`[data-media-id="${id}"]`).forEach(el => {

    else el.style.backgroundImage = `url('${url}')`;
  });
}

  if (mediaUrlCache[id]) { URL.revokeObjectURL(mediaUrlCache[id]); }
  delete mediaUrlCache[id];
}

// ---------- PROGRESS PHOTOS ----------
// Photo *metadata* (id/date/byte size) lives in state.progressPhotos and
// rides along in the normal JSON backup; the actual image bytes live in
// IndexedDB (see MEDIA STORAGE above), keeping localStorage small regardless
// of how many photos exist.
const PROGRESS_PHOTO_MAX_DIM = 900;
const PROGRESS_PHOTO_QUALITY = 0.72;
function getProgressPhotos() {
  return (state.progressPhotos || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
}
function getProgressPhotoUrl(id) {
  // Not-yet-migrated photos (see migrateLegacyProgressPhotos) still carry
  // their original dataUrl right on the metadata — use it directly rather
  // than waiting on a migration that may not have run yet.
  const meta = (state.progressPhotos || []).find(p => p.id === id);
  if (meta && meta.dataUrl) return meta.dataUrl;
  return getMediaUrl(id);
}
function getProgressPhotosStorageBytes() {
  return (state.progressPhotos || []).reduce((sum, p) => sum + (p.bytes || (p.dataUrl ? p.dataUrl.length * 0.75 : 0)), 0);
}
function fmtBytes(bytes) {
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
function compressImageToBlob(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not compress that image')), 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('Could not read that image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.readAsDataURL(file);
  });
}
function addProgressPhotoFromInput(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if (!file) return;
  compressImageToBlob(file, PROGRESS_PHOTO_MAX_DIM, PROGRESS_PHOTO_QUALITY).then(blob => {
    const id = 'p' + Date.now() + Math.random().toString(36).slice(2, 7);
    return idbPutMedia(id, blob).then(() => {
      mediaUrlCache[id] = URL.createObjectURL(blob); // have it in hand already — no IndexedDB read-back needed to display it
      state.progressPhotos = state.progressPhotos || [];
      state.progressPhotos.push({ id, date: new Date().toISOString(), bytes: blob.size });
      saveState();
      render();
    });
  }).catch(err => {
    console.error('LiftLog photo save error:', err);
    alert("Couldn't process that photo — try a different one.");
  });
}
function deleteProgressPhoto(id) {
  showConfirm({
    title: 'Delete this photo?',
    message: 'Removes it permanently from this device (and from any future backup).',
    confirmLabel: 'Delete',
    danger: true,
    onConfirm: () => {
      idbDeleteMedia(id).catch(err => console.error('LiftLog photo delete error:', err)); // best-effort — proceed regardless so a stuck IndexedDB write never blocks the user's delete
      revokeMediaUrl(id);
      state.progressPhotos = (state.progressPhotos || []).filter(p => p.id !== id);
      saveState();
      const overlay = document.getElementById('photoViewOverlay');
      if (overlay) overlay.remove();
      render();
    }
  });
}
function progressPhotosGridHtml() {
  const photos = getProgressPhotos().slice().reverse();
  if (!photos.length) return `<div class="empty" style="padding:10px 0;">No progress photos yet — tap "+ Add Photo" to start a visual record.</div>`;
  return `<div class="photo-grid">${photos.map(p => `
    <div class="photo-thumb" data-media-id="${p.id}" style="background-image:url('${getProgressPhotoUrl(p.id)}');" onclick="openPhotoViewModal('${p.id}')">
      <span class="photo-thumb-date">${new Date(p.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>
    </div>`).join('')}</div>`;
}

      <div class="row" style="margin-top:10px; align-items:center;">
        <span class="meta" style="margin:0; flex:1;">${new Date(photo.date).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' })}</span>
        <button class="btn small secondary" onclick="deleteProgressPhoto('${photo.id}')">🗑 Delete</button>

    </div>`;
  document.body.appendChild(overlay);

// One-time migration: earlier versions stored photos as base64 data URLs
// directly in state.progressPhotos (localStorage), which risked hitting the
// origin's quota. Moves each legacy photo's bytes into IndexedDB and slims
// the metadata left in state down to {id, date, bytes}. getProgressPhotoUrl()
// already reads a lingering `.dataUrl` directly, so photos display correctly
// on the very first load, before this has even finished — this just moves
// them off localStorage in the background. No-op once nothing has a
// dataUrl left; safe to call on every boot.
function migrateLegacyProgressPhotos() {
  const legacy = (state.progressPhotos || []).filter(p => p.dataUrl);
  if (!legacy.length) return;
  Promise.all(legacy.map(p =>
    dataUrlToBlob(p.dataUrl).then(blob => idbPutMedia(p.id, blob).then(() => {
      mediaUrlCache[p.id] = URL.createObjectURL(blob);
      p.bytes = blob.size;
      delete p.dataUrl;
      patchMediaNodesInPlace(p.id, mediaUrlCache[p.id]);
    })).catch(err => console.error('LiftLog photo migration error for', p.id, err)) // leave this one's dataUrl in place — it'll just retry next load
  )).then(() => saveState());
}

// ---------- WORKOUT DIAGRAMS (per-exercise reference image) ----------
// A small optional image shown in the corner of an exercise's card during a
// workout — e.g. a sketch of the movement or machine setup. Entirely
// opt-in and added only from the exercise's edit screen in Manage, never
// from the workout card itself: an exercise with no diagram gets zero
// extra markup and renders exactly as before (see diagramThumbHtml).
// Storage mirrors progress photos — the image blob lives in IndexedDB (see
// MEDIA STORAGE above); only {diagramImageId, diagramPosX, diagramPosY,
// diagramZoom} — a string and three small numbers — live on the exercise
// config itself, so this can't reintroduce the localStorage-quota problem
// no matter how many exercises end up with a diagram.
const DIAGRAM_MAX_DIM = 700;
const DIAGRAM_QUALITY = 0.75;
// Exercise diagram images additionally get saved as an actual file in the
// phone's Downloads/liftlog/ folder — a genuine local backup copy, separate
// from and in addition to the IndexedDB copy the app actually displays from.
// Uses the same download-trigger mechanism as the JSON backups already do;
// this is best-effort (a failure here never blocks the image from saving to
// IndexedDB, which is what the app itself depends on).
const LOCAL_IMAGE_BACKUP_FOLDER = 'liftlog/backup';
function downloadImageBlobLocally(blob, filename) {
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${LOCAL_IMAGE_BACKUP_FOLDER}/${filename}`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error('LiftLog local image backup error:', err); // non-fatal — the image is already safe in IndexedDB either way
  }
}
function slugifyForFilename(name) {
  return (name || 'exercise').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'exercise';
}

// Renders nothing at all for an exercise with no diagram — the one thing
// that has to hold for "no clutter if I choose not to add it."
function diagramThumbHtml(ex) {
  if (!ex.diagramImageId) return '';
  const posX = ex.diagramPosX ?? 50, posY = ex.diagramPosY ?? 50, zoom = ex.diagramZoom ?? 1;
  return `<div class="diagram-thumb-box" onclick="event.stopPropagation();">
    <img data-media-id="${ex.diagramImageId}" src="${getMediaUrl(ex.diagramImageId)}"
      style="object-position:${posX}% ${posY}%; transform:scale(${zoom});" alt="">
  </div>`;
}

function addExerciseDiagramFromInput(inputEl, exId) {
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if (!file) return;
  const ex = getExerciseById(exId);
  if (!ex) return;
  compressImageToBlob(file, DIAGRAM_MAX_DIM, DIAGRAM_QUALITY).then(blob => {
    const id = 'd' + Date.now() + Math.random().toString(36).slice(2, 7);
    return idbPutMedia(id, blob).then(() => {
      mediaUrlCache[id] = URL.createObjectURL(blob); // have it in hand already — no IndexedDB read-back needed to display it
      const oldId = ex.diagramImageId;
      ex.diagramImageId = id;
      ex.diagramPosX = 50; ex.diagramPosY = 50; ex.diagramZoom = 1; // centered, no zoom — reasonable default before the user repositions
      propagateLinkedExerciseConfig(ex);
      persistDays();
      saveState();
      if (oldId) { idbDeleteMedia(oldId).catch(() => {}); revokeMediaUrl(oldId); } // replacing an existing diagram — clean up the old blob
      downloadImageBlobLocally(blob, `${slugifyForFilename(ex.name)}-diagram.jpg`);
      refreshDiagramEditorSection(exId);
      openExerciseDiagramReposition(exId); // straight into reposition — matches "the image i add should have ability to reposition"
    });
  }).catch(err => {
    console.error('LiftLog diagram save error:', err);

function removeExerciseDiagram(exId) {

      idbDeleteMedia(oldId).catch(err => console.error('LiftLog diagram delete error:', err)); // best-effort — proceed regardless
      revokeMediaUrl(oldId);
      delete ex.diagramImageId; delete ex.diagramPosX; delete ex.diagramPosY; delete ex.diagramZoom;

// Keeps the "Edit exercise" modal's diagram section in sync after an add/
// reposition/remove, without touching the rest of that modal's (possibly

// way progress photos commit immediately rather than waiting on a form Save.
function refreshDiagramEditorSection(exId) {

function openExerciseDiagramReposition(exId) {
  const ex = getExerciseById(exId);
  if (!ex || !ex.diagramImageId) return;
  const existingOverlay = document.getElementById('diagramRepositionOverlay');
  if (existingOverlay) existingOverlay.remove();
  let posX = ex.diagramPosX ?? 50, posY = ex.diagramPosY ?? 50, zoom = ex.diagramZoom ?? 1;
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.id = 'diagramRepositionOverlay';
  overlay.style.zIndex = 220;
  overlay.innerHTML = `
    <div class="confirm-modal" style="max-width:360px;">
      <h3>Reposition diagram</h3>
      <div class="meta" style="margin-top:2px; margin-bottom:0;">Drag to move, use the slider to zoom. Works the same regardless of the image's original size or shape.</div>
      <div class="diagram-crop-box" id="diagramCropBox" style="margin-top:12px;">
        <img id="diagramCropImg" data-media-id="${ex.diagramImageId}" src="${getMediaUrl(ex.diagramImageId)}"
          style="object-position:${posX}% ${posY}%; transform:scale(${zoom});" alt="">
      </div>
      <div class="row" style="align-items:center; gap:10px; margin-top:14px;">
        <span class="meta" style="margin:0;">🔍</span>
        <input type="range" id="diagramZoomSlider" min="100" max="250" value="${Math.round(zoom * 100)}" style="flex:1;">
      </div>
      <div class="row" style="margin-top:16px; gap:8px;">
        <button class="btn secondary" id="diagramRepoCancelBtn" style="flex:1;">Cancel</button>
        <button class="btn" id="diagramRepoSaveBtn" style="flex:1;">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const box = overlay.querySelector('#diagramCropBox');
  const img = overlay.querySelector('#diagramCropImg');
  const slider = overlay.querySelector('#diagramZoomSlider');
  const applyStyle = () => { img.style.objectPosition = `${posX}% ${posY}%`; img.style.transform = `scale(${zoom})`; };

  let dragging = false, lastX = 0, lastY = 0;
  const onDown = (e) => {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    img.style.cursor = 'grabbing';
    img.setPointerCapture && e.pointerId != null && img.setPointerCapture(e.pointerId);
  };
  const onMove = (e) => {
    if (!dragging) return;
    const rect = box.getBoundingClientRect();
    const dx = (e.clientX - lastX) / rect.width * 100;
    const dy = (e.clientY - lastY) / rect.height * 100;
    // Dragging right/down should reveal more of the image's left/top — i.e.
    // move the visible anchor the opposite way from the finger/cursor.
    posX = Math.min(100, Math.max(0, posX - dx));
    posY = Math.min(100, Math.max(0, posY - dy));
    lastX = e.clientX; lastY = e.clientY;
    applyStyle();
  };
  const onUp = () => { dragging = false; img.style.cursor = 'grab'; };
  img.addEventListener('pointerdown', onDown);
  img.addEventListener('pointermove', onMove);
  img.addEventListener('pointerup', onUp);
  img.addEventListener('pointercancel', onUp);
  slider.oninput = () => { zoom = slider.value / 100; applyStyle(); };

  const close = () => overlay.remove();
  overlay.querySelector('#diagramRepoCancelBtn').onclick = close;
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('#diagramRepoSaveBtn').onclick = () => {
    ex.diagramPosX = Math.round(posX);
    ex.diagramPosY = Math.round(posY);
    ex.diagramZoom = Math.round(zoom * 100) / 100;
    propagateLinkedExerciseConfig(ex);
    persistDays();
    saveState();
    close();
    render();
    refreshDiagramEditorSection(exId);
  };
}

// ---------- BODY FAT % (U.S. Navy method) ----------
// Needs height (stored once, edited rarely) plus neck + waist (+ hips for
// women). Uses whatever the latest logged value of each is, even if they
// weren't all logged on the same day — same "best available" approach the
// rest of the measurements feature uses.
function getUserHeightCm() {
  return state.userHeightCm || null;
}
function setUserHeightCm(cm) {
  state.userHeightCm = cm;
  saveState();
}
function calcNavyBodyFat(waistCm, neckCm, heightCm, hipCm, gender) {
  if (gender === 'female') {
    if (hipCm == null) return null;
    return 495 / (1.29579 - 0.35004 * Math.log10(waistCm + hipCm - neckCm) + 0.22100 * Math.log10(heightCm)) - 450;
  }
  return 495 / (1.0324 - 0.19077 * Math.log10(waistCm - neckCm) + 0.15456 * Math.log10(heightCm)) - 450;
}
// Sanity-guards the formula's output — bad/impossible inputs (e.g. neck
// logged bigger than waist) can send log10() into a range that produces a
// meaningless number, so anything outside a plausible body-fat range is
// treated as "can't estimate" rather than shown.
function isPlausibleBodyFat(pct) {
  return typeof pct === 'number' && isFinite(pct) && pct > 2 && pct < 65;
}
function getBodyFatEstimate() {
  const height = getUserHeightCm();
  if (!height) return null;
  const neck = getLatestMeasurementValue('neck');
  const waist = getLatestMeasurementValue('waist');
  if (!neck || !waist) return null;
  const gender = getMeasurementsGender();
  const hip = gender === 'female' ? getLatestMeasurementValue('hips') : null;
  if (gender === 'female' && !hip) return null;
  const pct = calcNavyBodyFat(waist.value, neck.value, height, hip ? hip.value : null, gender);
  if (!isPlausibleBodyFat(pct)) return null;
  const dates = [neck.date, waist.date, ...(hip ? [hip.date] : [])];
  const oldest = dates.slice().sort()[0];
  return { pct: fmtMeasure1(pct), asOf: oldest, mixedDates: new Set(dates.map(dateStr)).size > 1 };
}
// One body-fat % per day where neck + waist (+ hips) were ALL logged
// together — a proper trend needs matched same-day inputs, unlike the
// "best available" current estimate above.
function getBodyFatHistory() {
  const height = getUserHeightCm();
  if (!height) return [];
  const gender = getMeasurementsGender();
  const out = [];
  for (const e of getMeasurementsLog()) {
    if (!e.values || e.values.neck == null || e.values.waist == null) continue;
    if (gender === 'female' && e.values.hips == null) continue;
    const pct = calcNavyBodyFat(e.values.waist, e.values.neck, height, e.values.hips, gender);
    if (isPlausibleBodyFat(pct)) out.push({ date: e.date, value: fmtMeasure1(pct) });
  }
  return out;
}
function openHeightModal() {
  const current = getUserHeightCm();
  let unit = 'cm';
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.style.zIndex = 210;
  overlay.innerHTML = `
    <div class="confirm-modal">
      <h3>Height</h3>
      <div class="meta" style="margin-bottom:0;">Used only for the body-fat % estimate. Set once, edit any time.</div>
      <div class="row" style="align-items:center; gap:8px; margin-top:12px;">
        <input type="number" inputmode="decimal" step="0.1" min="1" class="confirm-input" id="heightInputField"
          placeholder="Height" value="${current ? fmtMeasure1(current) : ''}" style="flex:1; margin-top:0;">
        <div class="row" style="gap:4px;">
          <button class="btn small" id="heightUnitCmBtn">cm</button>
          <button class="btn small secondary" id="heightUnitInBtn">in</button>
        </div>
      </div>
      <div class="row" style="margin-top:16px; gap:8px;">
        <button class="btn secondary" id="heightCancelBtn" style="flex:1;">Cancel</button>
        <button class="btn" id="heightSaveBtn" style="flex:1;">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  const field = overlay.querySelector('#heightInputField');
  const cmBtn = overlay.querySelector('#heightUnitCmBtn');
  const inBtn = overlay.querySelector('#heightUnitInBtn');
  const valueFor = (u) => {
    if (current == null) return '';
    return fmtMeasure1(u === 'in' ? cmToIn(current) : current);

// Standard weight(kg) / height(m)^2. Needs a logged bodyweight entry plus

// Purely local/in-app: there's no backend to push notifications while the
// app is closed, so the reliable mechanism is a banner shown when the app
// is opened after 4+ weeks. If notification permission already happens to
// be granted (from the timer-alert feature) we also fire a best-effort
// native notification, once per day, as a bonus — never the only signal.

  return localStorage.getItem('liftlog_measure_reminder') !== '0';
}

}
function daysSinceLastMeasurement() {
  const log = getMeasurementsLog();
  if (!log.length) return null;

  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const today = dateStr(new Date());
  if (localStorage.getItem('liftlog_measure_notify_last') === today) return;
  localStorage.setItem('liftlog_measure_notify_last', today);
  try {
    const days = daysSinceLastMeasurement();
    new Notification('LiftLog', { body: `It's been ${days} days since you logged body measurements.` });
  } catch (e) { /* best-effort only */ }
}

// ---------- MEASUREMENT GOALS ----------
// One optional target value (cm) per body part. Progress is measured from
// the FIRST logged value for that part (the starting point) toward the
// goal, so it works the same whether the goal is bigger or smaller than
// where you started (e.g. shrinking a waist vs. growing an arm).
function getMeasurementGoal(key) {
  const g = (state.measurementGoals || {})[key];
  return g == null ? null : g;
}
function setMeasurementGoal(key, cmValue) {
  state.measurementGoals = state.measurementGoals || {};
  if (cmValue == null) delete state.measurementGoals[key];
  else state.measurementGoals[key] = cmValue;
  saveState();
}
function getMeasurementGoalProgress(key) {
  const goal = getMeasurementGoal(key);
  if (goal == null) return null;
  const hist = getMeasurementHistoryForPart(key);
  if (!hist.length) return { goal, start: null, current: null, pct: 0, done: false };
  const start = hist[0].value;
  const current = hist[hist.length - 1].value;
  let pct = goal === start ? 100 : ((current - start) / (goal - start)) * 100;
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  const done = goal >= start ? current >= goal : current <= goal;
  return { goal, start, current, pct, done };
}

function bodyDiagramSvg() {
  const gender = getMeasurementsGender();
  const dotSet = gender === 'female' ? FEMALE_DOTS : MALE_DOTS;
  const uri = gender === 'female' ? FEMALE_SILHOUETTE_URI : MALE_SILHOUETTE_URI;
  const dots = dotSet.map(d => {
    const label = MEASUREMENT_PARTS.find(p => p.key === d.key).label;
    const latest = getLatestMeasurementValue(d.key);
    const valueLabel = latest
      ? `<div class="measure-dot-value" style="left:${d.x}%; top:${d.y}%;">${fmtMeasure1(latest.value)}</div>` : '';
    return `<div class="measure-dot measure-dot-${measureDotState(d.key)}" style="left:${d.x}%; top:${d.y}%; background:${measureDotColor(d.key)};"
      onclick="openMeasurementPartModal('${d.key}')" title="${label}"></div>${valueLabel}`;
  }).join('');
  return `
  <div class="measure-body-wrap">
    <img class="measure-body-img" src="${uri}" alt="${gender} body diagram" draggable="false">
    ${dots}
  </div>`;
}
// Body parts that don't come in left/right pairs — rendered in their own
// grid so the paired parts below always start a fresh row (see
// MEASUREMENT_LR_PAIRS above and measurementsGridHtml below). Otherwise an
// odd count here would push every pair out of alignment by one cell.
const MEASUREMENT_SINGLE_KEYS = ['neck', 'shoulders', 'chestLats', 'waist', 'hips'];
function measurementRowHtml(p) {
  const latest = getLatestMeasurementValue(p.key);
  const trend = latest ? getMeasurementTrend(p.key) : null;
  const delta = trend && trend.change != null
    ? `<span class="mdelta">${trend.change > 0 ? '▲' : trend.change < 0 ? '▼' : '–'}${Math.abs(trend.change)}</span>`
    : '';
  const trendBtn = latest
    ? `<button class="mtrend-btn" onclick="event.stopPropagation(); openMeasurementTrendModal('${p.key}')">📈</button>`
    : '';
  const goalBtn = `<button class="mtrend-btn" onclick="event.stopPropagation(); openMeasurementGoalModal('${p.key}')">🎯</button>`;
  const progress = getMeasurementGoalProgress(p.key);
  const goalBar = progress ? `
    <div class="mgoal-bar-wrap">
      <div class="mgoal-bar"><div class="mgoal-bar-fill" style="width:${progress.pct}%;"></div></div>
      <span class="mgoal-label">${progress.current == null ? `log to start · goal ${fmtMeasure1(progress.goal)}cm` : progress.done ? `🎉 goal reached (${fmtMeasure1(progress.goal)}cm)` : `${progress.pct}% to ${fmtMeasure1(progress.goal)}cm`}</span>
    </div>` : '';
  const change60 = getMeasurement60DayChange(p.key);
  const change60Html = change60
    ? `<div class="m60-change">${change60.pctText} vs ${change60.days}d ago</div>` : '';
  return `<div class="measure-row-wrap">
    <div class="measure-row" onclick="openMeasurementPartModal('${p.key}')">
      <span class="mlabel">${p.label}</span>
      <span class="mval-wrap">
        <span class="mval ${latest ? '' : 'empty'}">${latest ? fmtMeasure1(latest.value) + ' cm' : '—'}</span>
        ${delta}${trendBtn}${goalBtn}
      </span>
    </div>
    ${change60Html}
    ${goalBar}
  </div>`;
}
function measurementsGridHtml() {
  const singles = MEASUREMENT_PARTS.filter(p => MEASUREMENT_SINGLE_KEYS.includes(p.key));
  const singlesHtml = `<div class="measure-grid">${singles.map(measurementRowHtml).join('')}</div>`;
  // Each right/left pair gets its own 2-column grid strip — guarantees
  // right-then-left, side by side, regardless of how many rows came before.
  const pairsHtml = MEASUREMENT_LR_PAIRS.map(([rKey, lKey]) => {
    const rP = MEASUREMENT_PARTS.find(p => p.key === rKey);
    const lP = MEASUREMENT_PARTS.find(p => p.key === lKey);
    return `<div class="measure-grid" style="margin-top:6px;">${measurementRowHtml(rP)}${measurementRowHtml(lP)}</div>`;
  }).join('');
  return singlesHtml + pairsHtml;
}
function openMeasurementTrendModal(partKey) {
  const part = MEASUREMENT_PARTS.find(p => p.key === partKey);
  if (!part) return;
  const hist = getMeasurementHistoryForPart(partKey);
  if (!hist.length) return;
  const trend = getMeasurementTrend(partKey);

  const existing = document.getElementById('measureTrendOverlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.id = 'measureTrendOverlay';
  overlay.style.zIndex = 215;

  const statLine = trend.previous
    ? `Current: <strong>${fmtMeasure1(trend.latest.value)} cm</strong> · Previous: <strong>${fmtMeasure1(trend.previous.value)} cm</strong>
       (${new Date(trend.previous.date).toLocaleDateString()}) · Change:
       <strong style="color:#ff4d4d;">${trend.change > 0 ? '+' : ''}${trend.change} cm</strong>`
    : `Current: <strong>${fmtMeasure1(trend.latest.value)} cm</strong> · Log again another day to start seeing a trend.`;

  const rows = hist.slice().reverse().map((h, i) => {
    const prev = hist[hist.length - 2 - i];
    const d = prev ? fmtMeasure1(h.value - prev.value) : null;
    const dHtml = d != null
      ? `<span class="mdelta">${d > 0 ? '▲' : d < 0 ? '▼' : '–'}${Math.abs(d)}</span>`
      : '';
    return `<div class="histitem row" style="padding:6px 0;">
      <span class="meta" style="margin:0;">${new Date(h.date).toLocaleDateString()}: <strong>${fmtMeasure1(h.value)} cm</strong></span>
      ${dHtml}
    </div>`;
  }).join('');

  overlay.innerHTML = `
    <div class="confirm-modal measure-modal">
      <h3>📈 ${part.label} Trend</h3>
      <div class="meta" style="margin-bottom:0;">${statLine}</div>
      ${hist.length >= 2 ? `<div style="position:relative; height:180px; margin-top:12px;"><canvas id="measurePartChart"></canvas></div>` : ''}
      <div class="meta" style="margin-top:14px; margin-bottom:4px;">History</div>
      <div style="max-height:220px; overflow-y:auto;">${rows}</div>
      <div class="row" style="margin-top:16px;">
        <button class="btn secondary" id="measureTrendCloseBtn" style="flex:1;">Close</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => {
    if (measurePartChartRef) { measurePartChartRef.destroy(); measurePartChartRef = null; }
    overlay.remove();
  };
  overlay.querySelector('#measureTrendCloseBtn').onclick = close;
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  if (hist.length >= 2 && typeof Chart !== 'undefined') {
    setTimeout(() => {
      const canvas = document.getElementById('measurePartChart');
      if (!canvas) return;
      const cssVars = getComputedStyle(document.documentElement);
      const textFaintColor = cssVars.getPropertyValue('--text-faint').trim() || '#565b6c';
      const gridColor = cssVars.getPropertyValue('--border-strong').trim() || 'rgba(255,255,255,.12)';
      measurePartChartRef = new Chart(canvas, {
        type: 'line',
        data: {
          labels: hist.map(h => new Date(h.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })),
          datasets: [{
            data: hist.map(h => h.value),
            borderColor: '#ff4d4d',
            backgroundColor: '#ff4d4d22',
            borderWidth: 2.5,
            pointRadius: 3,
            pointBackgroundColor: '#ff4d4d',
            tension: 0.25,
            fill: true,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (ctx) => ctx.parsed.y + ' cm' } }
          },
          scales: {
            x: { ticks: { color: textFaintColor, maxTicksLimit: 6 }, grid: { color: gridColor } },
            y: { ticks: { color: textFaintColor }, grid: { color: gridColor } }
          }
        }
      });
    }, 0);
  }
}
function openMeasurementsDiagramModal() {
  const existing = document.getElementById('measureDiagramOverlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.id = 'measureDiagramOverlay';
  overlay.innerHTML = `
    <div class="confirm-modal measure-modal" style="max-height:85vh; overflow-y:auto;">
      <h3>📐 Body Measurements</h3>
      <div class="meta" style="margin-bottom:0;">Tap a point on the body to log that measurement, or use the list below.</div>
      <div class="measure-svg-wrap">${bodyDiagramSvg()}</div>
      ${measurementsGridHtml()}
      <div class="row" style="margin-top:16px;">
        <button class="btn secondary" id="measureCloseBtn" style="flex:1;">Done</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('#measureCloseBtn').onclick = () => { close(); render(); };
  overlay.addEventListener('click', e => { if (e.target === overlay) { close(); render(); } });
}
function refreshMeasurementsDiagramModal() {
  if (document.getElementById('measureDiagramOverlay')) openMeasurementsDiagramModal();
}
function openMeasurementPartModal(partKey) {
  const part = MEASUREMENT_PARTS.find(p => p.key === partKey);
  if (!part) return;
  const latest = getLatestMeasurementValue(partKey);
  const todaysEntry = getTodaysMeasurementEntry();
  const todaysVal = todaysEntry && todaysEntry.values ? todaysEntry.values[partKey] : null;
  let unit = state.measurementsUnit === 'in' ? 'in' : 'cm';

  const valueFor = (u) => {
    const cm = todaysVal != null ? todaysVal : (latest ? latest.value : null);
    if (cm == null) return '';
    return fmtMeasure1(u === 'in' ? cmToIn(cm) : cm);
  };

  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.style.zIndex = 210;
  overlay.innerHTML = `
    <div class="confirm-modal">
      <h3>${part.label}</h3>
      <div class="meta" style="margin-bottom:0;">${latest ? `Last logged: <strong>${bothMeasureUnits(latest.value)}</strong> (${new Date(latest.date).toLocaleDateString()})` : 'No measurements logged yet.'}</div>
      <div class="row" style="align-items:center; gap:8px; margin-top:12px;">
        <input type="number" inputmode="decimal" step="0.1" min="1" class="confirm-input" id="measureInputField"
          placeholder="${part.label}" value="${valueFor(unit)}" style="flex:1; margin-top:0;">
        <div class="row" style="gap:4px;">
          <button class="btn small ${unit === 'cm' ? '' : 'secondary'}" id="measureUnitCmBtn">cm</button>
          <button class="btn small ${unit === 'in' ? '' : 'secondary'}" id="measureUnitInBtn">in</button>
        </div>
      </div>
      <div class="row" style="margin-top:16px; gap:8px;">
        <button class="btn secondary" id="measureCancelBtn" style="flex:1;">Cancel</button>
        <button class="btn" id="measureSaveBtn" style="flex:1;">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  const field = overlay.querySelector('#measureInputField');
  const cmBtn = overlay.querySelector('#measureUnitCmBtn');
  const inBtn = overlay.querySelector('#measureUnitInBtn');

  const setUnit = (u) => {
    unit = u;
    cmBtn.className = `btn small ${unit === 'cm' ? '' : 'secondary'}`;
    inBtn.className = `btn small ${unit === 'in' ? '' : 'secondary'}`;
    field.value = valueFor(unit);
  };
  cmBtn.onclick = () => setUnit('cm');
  inBtn.onclick = () => setUnit('in');

  overlay.querySelector('#measureCancelBtn').onclick = close;
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('#measureSaveBtn').onclick = () => {
    const n = parseFloat(field.value);
    if (isNaN(n) || n <= 0) { field.style.borderColor = 'var(--danger)'; field.focus(); return; }
    const cmValue = unit === 'in' ? inToCm(n) : n;
    state.measurementsLog = state.measurementsLog || [];
    state.measurementsUnit = unit;
    const today = dateStr(new Date());
    let entry = state.measurementsLog.find(e => dateStr(e.date) === today);
    if (!entry) { entry = { date: new Date().toISOString(), values: {} }; state.measurementsLog.push(entry); }
    entry.values = entry.values || {};
    entry.values[partKey] = fmtMeasure1(cmValue);
    saveState();
    close();
    refreshMeasurementsDiagramModal();
    render();
  };
  setTimeout(() => field.focus(), 50);
}

function getMuscleGroupVolumeStats(dayLabel) {
  const day = DAYS.find(d => d.label === dayLabel);
  const { anchorDate: curAnchor, sessionNum: curSessionNum } = getActiveSession(dayLabel);
  const currentIsIncomplete = day ? getTodayCompletionPct(day) < 100 : false;

  const seen = new Map();
  state.history.filter(h => h.day === dayLabel).forEach(h => {
    const dk = getEntryDateKey(h);
    const num = getEntrySessionNum(h);
    const key = dk + '__s' + num;
    if (!seen.has(key)) seen.set(key, { dateKey: dk, sessionNum: num });
  });
  let sessions = [...seen.values()].sort((a,b) => a.dateKey.localeCompare(b.dateKey) || a.sessionNum - b.sessionNum);
  if (currentIsIncomplete) {
    sessions = sessions.filter(s => !(s.dateKey === curAnchor && s.sessionNum === curSessionNum));
  }
  const volumesWithDate = sessions.map(({dateKey, sessionNum}) => {
    const vol = getSessionVolume(dateKey, dayLabel, sessionNum);
    return vol == null ? null : { date: dateKey, vol };
  }).filter(d => d != null);
  if (volumesWithDate.length === 0) return null;
  const volumes = volumesWithDate.map(d => d.vol);
  const mean = Math.round(volumes.reduce((a,b) => a+b, 0) / volumes.length);
  const last = volumesWithDate[volumesWithDate.length - 1];
  const recent = volumes.slice(-3);
  const recentMean = Math.round(recent.reduce((a,b) => a+b, 0) / recent.length);
  return { mean, last: last.vol, lastDate: last.date, count: volumes.length, recentMean, trendUp: last.vol >= recentMean };
}

// Same session-grouping as getMuscleGroupDurationStats above, but averaged
// over only the most recent n sessions for that workout group instead of
// all-time — this is what feeds the "recent pace" spider chart, since an
// all-time average would be slow to reflect a workout that's gotten faster
// or slower lately.
function getRecentAvgDuration(dayLabel, n = 3) {
  // If this day's workout is being logged right now and isn't finished yet,
  // its elapsed-so-far time isn't a real "how long this workout took" —
  // averaging it in would both understate the time and keep changing the
  // number as more sets get logged. Drop it from the pool so "last N" always
  // means N finished workouts, not N-1 finished plus one still in progress.
  const day = DAYS.find(d => d.label === dayLabel);
  const { anchorDate: curAnchor, sessionNum: curSessionNum } = getActiveSession(dayLabel);
  const currentIsIncomplete = day ? getTodayCompletionPct(day) < 100 : false;
  const currentHasOverride = getDurationOverride(curAnchor, dayLabel, curSessionNum) != null;

  const seen = new Map();
  state.history.filter(h => h.day === dayLabel).forEach(h => {
    const dk = getEntryDateKey(h);
    const num = getEntrySessionNum(h);
    const key = dk + '__s' + num;
    if (!seen.has(key)) seen.set(key, { dateKey: dk, sessionNum: num });
  });
  let sessions = [...seen.values()].sort((a,b) => a.dateKey.localeCompare(b.dateKey) || a.sessionNum - b.sessionNum);
  if (currentIsIncomplete && !currentHasOverride) {
    sessions = sessions.filter(s => !(s.dateKey === curAnchor && s.sessionNum === curSessionNum));
  }
  sessions = sessions.slice(-n);
  // Same canonical duration source as the completion modal — see the note
  // in getMuscleGroupDurationStats above.
  const durations = sessions.map(({dateKey, sessionNum}) => getSessionDuration(dateKey, dayLabel, sessionNum)).filter(d => d != null);
  if (durations.length === 0) return null;
  return { mean: Math.round(durations.reduce((a,b) => a+b, 0) / durations.length), count: durations.length };
}

function getOverviewStats() {
  const totalSessions = new Set(state.history.map(h => `${h.sessionDate || dateStr(h.date)}::${h.day}::${h.sessionNum || 1}`)).size;
  const totalVolume = state.history.reduce((sum, h) => {
    if (h.weight && !h.skipped) return sum + h.weight * h.sets.reduce((a,b) => a+b, 0);
    return sum;
  }, 0);
  const exercisesTracked = new Set(state.history.map(h => h.exercise)).size;
  const thisMonthKey = dateStr(new Date()).slice(0,7);
  const thisMonthSessions = new Set(
    state.history.filter(h => (h.sessionDate || dateStr(h.date)).startsWith(thisMonthKey))
      .map(h => `${h.sessionDate || dateStr(h.date)}::${h.day}::${h.sessionNum || 1}`)
  ).size;

  let totalTimeMinutes = 0, timedSessionCount = 0;
  getAllUniqueSessions().forEach(({dateKey, dayLabel, sessionNum}) => {
    const mins = getSessionDuration(dateKey, dayLabel, sessionNum);
    if (mins != null) { totalTimeMinutes += mins; timedSessionCount++; }
  });
  const avgSessionMinutes = timedSessionCount ? Math.round(totalTimeMinutes / timedSessionCount) : null;

  return { totalSessions, totalVolume: Math.round(totalVolume), exercisesTracked, thisMonthSessions, totalTimeMinutes, avgSessionMinutes };
}

function getAllTimeBests(day) {

// ---------- TODAY-AT-A-GLANCE DASHBOARD ----------
// A small, self-contained metric layer sitting on top of data the app
// already has (state.history, getExState, getMuscleGroupDurationStats,
// computeStreak) — it reads, never writes, so it can't drift out of sync
// with the actual progression engine.

// Median gap (in days) between sessions of a given day-label — used for the
// "recovery status" read on the dashboard header.
function getDayCadenceDays(dayLabel) {
  const dates = getAllUniqueSessions().filter(s => s.dayLabel === dayLabel).map(s => new Date(s.dateKey).getTime()).sort((a,b)=>a-b);
  const uniq = [...new Set(dates)];
  if (uniq.length < 2) return 7 * DAYS.length; // no history yet — assume one full rotation
  const gaps = [];
  for (let i = 1; i < uniq.length; i++) gaps.push((uniq[i]-uniq[i-1]) / 86400000);
  gaps.sort((a,b)=>a-b);
  const mid = Math.floor(gaps.length/2);
  return gaps.length % 2 ? gaps[mid] : (gaps[mid-1]+gaps[mid])/2;
}

function getRecoveryStatus(dayLabel) {
  const sessions = getAllUniqueSessions().filter(s => s.dayLabel === dayLabel).sort((a,b) => a.dateKey.localeCompare(b.dateKey));
  if (!sessions.length) return { label: 'No history yet', level: 'neutral' };
  const last = sessions[sessions.length - 1];
  const daysSince = Math.floor((Date.now() - new Date(last.dateKey).getTime()) / 86400000);
  const cadence = getDayCadenceDays(dayLabel);
  const ratio = cadence > 0 ? daysSince / cadence : 1;
  if (ratio < 0.5) return { label: 'Still recovering', level: 'low' };
  if (ratio <= 1.4) return { label: 'Recovered · ready', level: 'good' };
  return { label: 'Well rested (or overdue)', level: 'neutral' };
}

// Average consistency across every exercise with enough history to measure —
// a single "how on-pace am I overall" percentage for the header.
function getOverallConsistencyPct() {
  const allEx = DAYS.flatMap(d => d.exercises);
  const measurable = allEx.filter(ex => state.history.filter(h => h.exercise === ex.name && !h.skipped).length >= 2);
  if (!measurable.length) return null;
  const avg = measurable.reduce((sum, ex) => sum + getExerciseConsistency(ex.name), 0) / measurable.length;
  return Math.round(avg * 100);
}

// Composite 0-100 "how's this workout going" score. Weights: completion is
// the biggest single driver (it's literally what "today" is about), then
// consistency (the habit that actually compounds), then a streak and PR
// bonus on top. Intentionally simple/transparent rather than a black box.
function computeWorkoutScore({ completionPct, consistencyPct, streak, prsToday }) {
  const completionScore = completionPct; // 0-100, weight 0.5
  const consistencyScore = consistencyPct ?? 60; // neutral default when no data yet
  const streakScore = Math.min(100, streak * 12); // saturates around a 8-week streak
  let score = completionScore * 0.5 + consistencyScore * 0.3 + streakScore * 0.2;
  score += Math.min(10, prsToday * 5); // small bonus, doesn't dominate
  return Math.round(Math.min(100, score));
}
function scoreToGrade(score) {
  if (score >= 97) return 'A+';
  if (score >= 90) return 'A';
  if (score >= 83) return 'B+';
  if (score >= 75) return 'B';
  if (score >= 65) return 'C+';
  if (score >= 50) return 'C';
  return 'D';
}

// current(number), baseline(number|null) -> { arrow, dir, pct, colorVar }.
// invertGood=true for metrics where a *decrease* is the good direction
// (e.g. workout duration getting shorter for the same work).
function computeTrend(current, baseline, invertGood = false) {
  if (baseline == null || baseline === 0 || current == null) return { arrow: '→', dir: 'flat', pct: null, colorVar: 'var(--text-faint)' };
  const pct = Math.round(((current - baseline) / baseline) * 100);
  if (Math.abs(pct) < 3) return { arrow: '→', dir: 'flat', pct, colorVar: 'var(--text-faint)' };
  const dir = pct > 0 ? 'up' : 'down';
  const isGood = invertGood ? dir === 'down' : dir === 'up';
  return { arrow: dir === 'up' ? '▲' : '▼', dir, pct, colorVar: isGood ? 'var(--success)' : 'var(--danger)' };
}

function getTodayDashboardStats() {
  const day = DAYS[currentDayIdx];
  if (!day) return null;
  const completionPct = getTodayCompletionPct(day);
  const { anchorDate, sessionNum } = getActiveSession(day.label);
  const todaysEntries = state.history.filter(h => getEntryDateKey(h) === anchorDate && h.day === day.label && getEntrySessionNum(h) === sessionNum);
  const doneNames = new Set(todaysEntries.map(h => h.exercise));
  const completedCount = doneNames.size;
  const remainingCount = Math.max(0, day.exercises.length - completedCount);
  const setsToday = todaysEntries.reduce((sum, h) => sum + (h.sets ? h.sets.length : 0), 0);
  const volumeToday = Math.round(todaysEntries.reduce((sum, h) => sum + (h.weight && !h.skipped ? h.weight * h.sets.reduce((a,b)=>a+b,0) : 0), 0));
  const durationSoFar = getSessionDuration(anchorDate, day.label, sessionNum);
  const durStats = getMuscleGroupDurationStats(day.label);
  const estFinishMins = durStats && completionPct > 0 && completionPct < 100
    ? Math.max(0, Math.round(durStats.mean * (1 - completionPct / 100)))
    : null;
  const prsToday = (state.prs || []).filter(p => dateStr(p.date) === dateStr(new Date())).length;
  const streak = computeStreak();
  const consistencyPct = getOverallConsistencyPct();
  const recovery = getRecoveryStatus(day.label);
  const score = computeWorkoutScore({ completionPct, consistencyPct, streak, prsToday });

  // 30-day average session volume for this day, for the trend chip.
  const priorSessions = getAllUniqueSessions().filter(s => s.dayLabel === day.label && s.dateKey !== anchorDate);
  const cutoff30 = Date.now() - 30 * 86400000;
  const recentVols = priorSessions.filter(s => new Date(s.dateKey).getTime() >= cutoff30).map(s => {
    const entries = state.history.filter(h => getEntryDateKey(h) === s.dateKey && h.day === day.label && getEntrySessionNum(h) === s.sessionNum);
    return entries.reduce((sum, h) => sum + (h.weight && !h.skipped ? h.weight * h.sets.reduce((a,b)=>a+b,0) : 0), 0);
  });
  const avgVol30 = recentVols.length ? Math.round(recentVols.reduce((a,b)=>a+b,0) / recentVols.length) : null;
  const volumeTrend = volumeToday > 0 ? computeTrend(volumeToday, avgVol30) : null;

  const avgDur30 = durStats ? durStats.mean : null;
  const durationTrend = durationSoFar != null ? computeTrend(durationSoFar, avgDur30, true) : null;

  return {
    day, completionPct, completedCount, remainingCount, setsToday, volumeToday,
    durationSoFar, estFinishMins, prsToday, streak, consistencyPct, recovery,
    score, grade: scoreToGrade(score), volumeTrend, durationTrend,
    anchorDate, sessionNum,
  };
}

function generateIntelligentSummary(stats) {
  if (!stats) return 'Log a few sessions to unlock trend insights.';
  const { volumeTrend, durationTrend, consistencyPct, completionPct } = stats;
  if (completionPct === 0) {
    if (consistencyPct != null && consistencyPct >= 85) return `On pace — you're training consistently. Ready when you are.`;
    return `Ready to start ${escapeHtml(stats.day.label)}.`;
  }
  if (volumeTrend && volumeTrend.dir === 'up' && volumeTrend.pct >= 8) {
    return `Excellent progress. Volume is up ${volumeTrend.pct}% vs your recent average for this day.`;
  }
  if (volumeTrend && volumeTrend.dir === 'down' && volumeTrend.pct <= -8) {
    return `Progress has slowed today — volume is down ${Math.abs(volumeTrend.pct)}% vs your recent average. Recovery or fatigue may be a factor.`;
  }
  if (durationTrend && durationTrend.dir === 'down' && durationTrend.colorVar === 'var(--success)') {
    return `Efficient session — moving faster than your recent average pace for this day.`;
  }
  if (consistencyPct != null && consistencyPct < 60) {
    return `Consistency has dropped to ${consistencyPct}% recently — that's the biggest lever on your long-term progress right now.`;
  }
  return `Solid, steady session. Keep the pace up.`;
}

// Small, collapsible-feeling settings strip for the prediction feature —
// deliberately lives right under the chart it controls rather than in the
// global Settings page, since it's chart-scoped configuration.
function renderPredictionSettingsPanel() {
  const s = getPredictionSettings();
  const modeBtn = (key, label) => `<div class="tab" style="${s.mode===key ? 'background:var(--accent);color:#fff;' : ''}" onclick="setPredictionSetting('mode','${key}')">${label}</div>`;
  const toggleRow = (key, label) => `
    <div class="pred-toggle-row">
      <span>${label}</span>
      <div class="pred-switch ${s[key] ? 'on' : ''}" onclick="setPredictionSetting('${key}', ${!s[key]})"><div class="pred-switch-knob"></div></div>
    </div>`;
  return `<div class="pred-settings">
    <div class="pred-toggle-row" style="margin-bottom:4px;">
      <span style="font-weight:700;">🔮 Predictions</span>
      <div class="pred-switch ${s.enabled ? 'on' : ''}" onclick="setPredictionSetting('enabled', ${!s.enabled})"><div class="pred-switch-knob"></div></div>
    </div>
    ${s.enabled ? `
      <div class="tabs" style="padding:8px 0 4px; background:transparent;">${modeBtn('conservative','Conservative')}${modeBtn('normal','Normal')}${modeBtn('aggressive','Aggressive')}</div>
      ${toggleRow('showFutureLine', 'Show future line on chart')}
      ${toggleRow('showMilestones', 'Show milestone cards')}
      ${toggleRow('showConfidence', 'Show confidence %')}
    ` : ''}
  </div>`;
}

let chartRef = null;
// Called when navigating away from Progress — the canvases these are
// attached to get removed from the DOM by the next view's innerHTML swap,
// but Chart.js instances aren't cleaned up automatically just because their
// canvas is gone, so without this each Progress visit leaked one more
// detached Chart.js instance still listening for resize events etc.
function destroyProgressCharts() {
  if (chartRef) { chartRef.destroy(); chartRef = null; }
  if (durationRadarRef) { durationRadarRef.destroy(); durationRadarRef = null; }
  if (bodyweightChartRef) { bodyweightChartRef.destroy(); bodyweightChartRef = null; }
}
function renderCharts() {
  const ex = getExerciseById(progressExerciseId);
  const predEl = document.getElementById('predictionText');
  const canvas = document.getElementById('progressChart');
  const cardsWrap = document.getElementById('projectionCardsWrap');
  if (cardsWrap) cardsWrap.innerHTML = '';
  if (!ex) {
    if (predEl) predEl.textContent = 'Add an exercise to this day to see progression.';
    if (chartRef) { chartRef.destroy(); chartRef = null; }
    return;
  }
  if (typeof Chart === 'undefined') {
    if (predEl) predEl.textContent = 'Charts need internet the first time to load (they\u2019re cached offline after that).';
    if (canvas) canvas.style.display = 'none';
    return;
  }

  const supportsWeight = ex.mode === 'weighted' || ex.mode === 'weighted_bw';
  const isVolumeMode = chartMetric === 'volume' && supportsWeight;
  const isE1rmMode = chartMetric === 'e1rm' && supportsWeight;
  const predSettings = getPredictionSettings();

  const rangeDays = chartRange === '30' ? 30 : chartRange === '90' ? 90 : null;
  let points = state.history.filter(h => ex.name === h.exercise && !h.skipped);
  if (rangeDays != null) {
    const cutoff = Date.now() - rangeDays * 86400000;
    points = points.filter(p => new Date(p.date).getTime() >= cutoff);
  }

  if (points.length === 0) {
    if (chartRef) { chartRef.destroy(); chartRef = null; }
    if (canvas) canvas.style.display = 'none';
    if (predEl) predEl.textContent = 'No sessions logged in this time range.';
    return;
  }
  if (canvas) canvas.style.display = '';

  const labels = points.map(p => new Date(p.date).toLocaleDateString());
  const data = isVolumeMode
    ? points.map(p => (p.weight || 0) * p.sets.reduce((a,b) => a+b, 0))
    : isE1rmMode
      ? points.map(p => estimate1RM(p.weight || 0, Math.max(...p.sets)))
      : points.map(p => p.weight ?? Math.max(...p.sets));

  // Quick one-line trend note. Reuses the same prediction engine that
  // drives the chart's future line and the projection cards below —
  // no separate regression logic duplicated here.
  let predictionMsg = '';
  const engineResult = (!isVolumeMode && predSettings.enabled) ? predictExercise(ex) : null;
  if (isVolumeMode) {
    if (data.length >= 3) {
      const pctChange = data[0] > 0 ? Math.round(((data[data.length-1] - data[0]) / data[0]) * 100) : 0;
      predictionMsg = `Total volume per session is ${pctChange >= 0 ? 'up' : 'down'} ${Math.abs(pctChange)}% over this range.`;
    } else {
      predictionMsg = 'Log a few more sessions to see a volume trend.';
    }
  } else if (engineResult) {
    const proj3 = engineResult.projections.find(x => x.months === 3);
    if (isE1rmMode) {
      predictionMsg = proj3.progressPct > 0
        ? `At current pace, ~${proj3.predictedE1rm} lb estimated 1RM projected in ~3 months.`
        : `Trend is flat/declining — keep logging for a better estimate.`;
    } else if (ex.mode === 'weighted') {
      predictionMsg = proj3.progressPct <= 0
        ? `Trend is flat/declining — no clear projection yet. Keep logging for a better estimate.`
        : `At current pace, ~${proj3.predictedWorkingWeight} lb projected in ~3 months.`;
    } else if (ex.mode === 'weighted_bw') {
      predictionMsg = proj3.progressPct > 0
        ? `At current pace, ~+${Math.max(0, proj3.predictedWorkingWeight - (proj3.currentWorkingWeight||0))} lb belt weight projected in ~3 months.`
        : `Trend is flat/declining — keep logging for a better estimate.`;
    } else if (ex.mode === 'timed') {
      predictionMsg = proj3.progressPct > 0 ? `At current pace, ~${proj3.predictedE1rm}s hold projected in ~3 months.` : `Trend is flat — keep logging.`;
    } else {
      predictionMsg = proj3.progressPct > 0 ? `At current pace, ~${proj3.predictedE1rm} reps projected in ~3 months.` : `Trend is flat — keep logging.`;
    }
  } else if (!predSettings.enabled) {
    predictionMsg = 'Predictions are turned off.';
  } else {
    predictionMsg = 'Log a few more sessions to unlock a trend projection.';
  }
  if (ex.mode === 'weighted_bw' && isE1rmMode) {
    predictionMsg += ' (Based on added belt weight only — bodyweight itself isn\u2019t tracked.)';
  }
  if (predEl) predEl.textContent = predictionMsg;

  if (chartRef) chartRef.destroy();
  const chartLabel = isVolumeMode ? 'Total Volume (lb)' : isE1rmMode ? 'Estimated 1RM (lb)' : 'Weight / Best reps';
  const chartColor = isVolumeMode ? '#ff6b4a' : isE1rmMode ? '#3ecf6e' : '#4f7cff';
  const cssVars = getComputedStyle(document.documentElement);
  const textColor = cssVars.getPropertyValue('--text').trim() || '#e8e8ec';
  const textDimColor = cssVars.getPropertyValue('--text-dim').trim() || '#9aa0ac';

  const datasets = [{ label: chartLabel, data, borderColor: chartColor, backgroundColor: chartColor + '26', fill:true, tension:0.3, pointRadius: 3 }];
  let futureMeta = []; // parallel metadata for the predicted dataset's tooltip

  const showFuture = !isVolumeMode && engineResult && predSettings.enabled && predSettings.showFutureLine;
  if (showFuture) {
    const horizons = [1,2,3,4,5,6,8,10,12,15,18,21,24];
    const finePred = predictExercise(ex, horizons);
    const futureLabels = horizons.map(m => {
      const d = new Date(); d.setMonth(d.getMonth() + m);
      return d.toLocaleDateString();
    });
    const futureValues = finePred.projections.map(p => isE1rmMode ? p.predictedE1rm : (supportsWeight ? p.predictedWorkingWeight : p.predictedE1rm));
    futureMeta = finePred.projections.map(p => ({ predictedE1rm: p.predictedE1rm, predictedWorkingWeight: p.predictedWorkingWeight, confidence: p.confidence }));

    // Dim the "actual" dataset's fill a touch so the eye reads the predicted
    // segment as clearly secondary, per "historical data always has higher
    // visual priority" — solid color/full opacity for actual, translucent
    // dashed for predicted.
    const predictedSeriesData = new Array(labels.length - 1).fill(null).concat([data[data.length-1], ...futureValues]);
    labels.push(...futureLabels);
    datasets[0].data = data.concat(new Array(futureValues.length).fill(null));
    datasets.push({
      label: 'Predicted',
      data: predictedSeriesData,
      borderColor: chartColor + '99',
      backgroundColor: 'transparent',
      borderDash: [7, 5],
      fill: false,
      tension: 0.25,
      pointRadius: (ctx) => ctx.dataIndex === labels.length - horizons.length ? 3 : 2,
      pointStyle: 'rectRot',
      pointBackgroundColor: chartColor + '99',
    });

    renderProjectionCards(cardsWrap, ex, finePred, predSettings);
  } else if (cardsWrap) {
    cardsWrap.innerHTML = '';
  }

  chartRef = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      plugins: {
        legend: { display: datasets.length > 1, labels: { color: textColor } },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              if (ctx.datasetIndex === 1) {
                const idx = ctx.dataIndex - (labels.length - futureMeta.length);
                const meta = futureMeta[idx];
                if (!meta) return `Predicted: ${ctx.formattedValue}`;
                const lines = [`Predicted: ${ctx.formattedValue}`, `Est. 1RM: ${meta.predictedE1rm} lb`];
                if (predSettings.showConfidence) lines.push(`Confidence: ${meta.confidence}%`);
                return lines;
              }
              return `${ctx.dataset.label}: ${ctx.formattedValue}`;
            }
          }
        }
      },
      scales: { x:{ ticks:{ color: textDimColor } }, y:{ ticks:{ color: textDimColor }, beginAtZero:false } }
    }
  });
}

// Spider/radar chart: one axis per workout day, plotting the average
// session length across just that day's last 3 logged workouts (not
// all-time) so it reflects how the workout has been going *lately* — a day
// that's gotten faster or slower recently shows up right away instead of
// being smoothed out by months of history.
let durationRadarRef = null;
function renderDurationRadarChart() {
  const canvas = document.getElementById('durationRadarChart');
  const note = document.getElementById('durationRadarNote');
  if (durationRadarRef) { durationRadarRef.destroy(); durationRadarRef = null; }
  if (!canvas) return;

  const n = getRadarSessionCount();
  const rows = DAYS.map(d => ({ day: d, stats: getRecentAvgDuration(d.label, n) }));
  const hasAnyData = rows.some(r => r.stats);
  const missing = rows.filter(r => !r.stats).map(r => r.day.label);
  if (note) {
    note.textContent = !hasAnyData ? 'Log a few workouts to see this fill in.'
      : missing.length ? `Not enough recent data for: ${missing.join(', ')} — shown at center.` : '';
  }
  if (!hasAnyData) return;

  const cssVars = getComputedStyle(document.documentElement);
  const textColor = cssVars.getPropertyValue('--text').trim() || '#e8e8ec';
  const textFaintColor = cssVars.getPropertyValue('--text-faint').trim() || '#565b6c';
  const gridColor = cssVars.getPropertyValue('--border-strong').trim() || 'rgba(255,255,255,.12)';
  const accent = cssVars.getPropertyValue('--accent').trim() || '#5b7fff';

  const values = rows.map(r => r.stats ? r.stats.mean : 0);
  const suggestedMax = Math.max(20, Math.ceil((Math.max(...values) * 1.25) / 10) * 10);

  durationRadarRef = new Chart(canvas, {

// Renders the 3/6/12/24-month milestone cards under the chart, plus a short
// list of data-grounded insights. Pure DOM write into the container the
// Progress page template already reserved — kept out of the main template
// string since it depends on the async-loaded Chart.js/prediction pass.
function renderProjectionCards(wrap, ex, pred, settings) {
  if (!wrap || !settings.showMilestones) { if (wrap) wrap.innerHTML = ''; return; }
  const supportsWeight = ex.mode === 'weighted' || ex.mode === 'weighted_bw';
  const targetHorizons = [3, 6, 12, 24];
  const cards = targetHorizons.map(m => {
    const p = pred.projections.find(x => x.months === m);
    if (!p) return '';
    const confColor = p.confidence >= 80 ? 'var(--success)' : p.confidence >= 55 ? '#ffcb4a' : 'var(--text-faint)';
    const primaryVal = supportsWeight ? `${p.predictedWorkingWeight} ${pred.unit}` : `${p.predictedE1rm} ${pred.unit}`;
    const deltaVal = supportsWeight && p.deltaWorkingWeight != null ? `(+${Math.max(0,p.deltaWorkingWeight)} ${pred.unit})` : `(${p.progressPct >= 0 ? '+' : ''}${p.progressPct}%)`;
    return `<div class="proj-card">
      <div class="proj-card-h">${m < 12 ? m + ' Months' : (m/12) + ' Year' + (m>12?'s':'')}</div>
      <div class="proj-card-primary">${primaryVal}</div>
      <div class="proj-card-delta">${deltaVal}</div>
      ${supportsWeight ? `<div class="proj-card-sub">Est. 1RM: ${p.predictedE1rm} lb</div>` : ''}
      <div class="proj-card-sub">Volume: ${p.progressPct >= 0 ? '+' : ''}${p.progressPct}%</div>
      ${settings.showConfidence ? `<div class="proj-card-conf"><span class="proj-conf-dot" style="background:${confColor};"></span>${p.confidence}% confidence</div>` : ''}
      ${p.atCeiling ? `<div class="proj-card-sub" style="color:var(--danger);">At equipment ceiling</div>` : ''}
    </div>`;
  }).join('');

  const insights = generatePredictionInsights(ex);
  const insightsHtml = insights.length ? `<div class="pred-insights">${insights.map(i => `<div class="pred-insight-row">💡 ${escapeHtml(i)}</div>`).join('')}</div>` : '';

  wrap.innerHTML = `<div class="proj-cards-label">Future Progress Prediction <span style="font-weight:400;color:var(--text-faint);">(${settings.mode})</span></div>
    <div class="proj-cards-row">${cards}</div>
    ${insightsHtml}`;
}


let calendarOffset = 0;

function changeMonth(delta) {
  calendarOffset += delta;
  render();
}

function renderCalendar() {
  const workoutDates = new Set(state.history.map(h => getEntryDateKey(h)));
  const base = new Date();
  base.setMonth(base.getMonth() + calendarOffset);
  const year = base.getFullYear();
  const month = base.getMonth();
  const monthLabel = base.toLocaleString('default', { month: 'long', year: 'numeric' });

  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay(); // 0 = Sunday
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = dateStr(new Date());

  const dowHeaders = ['S','M','T','W','T','F','S'].map(d => `<div class="cal-dow">${d}</div>`).join('');

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const cellDate = new Date(year, month, day);
    const key = dateStr(cellDate);
    const worked = workoutDates.has(key);
    const isToday = key === todayStr;
    cells += `<div class="cal-cell ${worked?'worked':''} ${isToday?'today':''}">${day}</div>`;
  }

  return `<div class="card">
    <div class="row">
      <button class="btn small secondary" onclick="changeMonth(-1)">‹</button>
      <h3>${monthLabel}</h3>
      <button class="btn small secondary" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid">${dowHeaders}${cells}</div>
    <div class="meta" style="margin-top:8px;">🟢 worked out · ⬜ rest / no log</div>
  </div>`;
}
